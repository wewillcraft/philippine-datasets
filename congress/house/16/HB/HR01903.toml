longTitle = "RESOLUTION EXPRESSING THE SENSE OF THE MEMBERS OF THE NATIONALIST PEOPLE'S COALITION (NPC) IN EXTENDING OUR DEEPEST CONDOLENCES TO THE GRIEVING FAMILIES OF THE FORTY-FOUR (44) OFFICERS OF THE PHILIPPINE NATIONAL POLICE-SPECIAL ACTION FORCES (PNP-SAF) WHO GALLANTLY FOUGHT UNTIL THEIR LAST BREATH IN THE PERFORMANCE OF THEIR DUTY TO PROTECT AND SERVE THE COUNTRY, CONDEMNING THIS BRUTAL MASSACRE AND URGING THE HOUSE OF REPRESENTATIVES TO SUSPEND ANY PROCEEDINGS RELATING TO THE PROPOSED BANGSAMORO BASIC LAW UNTIL COMPLETION AND SUBMISSION OF THE RESULTS OF THE INVESTIGATION OF THIS HEINOUS CRIME"
