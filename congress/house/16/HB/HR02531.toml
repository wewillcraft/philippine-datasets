longTitle = "RESOLUTION DIRECTING THE HOUSE COMMITTEE ON TRADE AND INDUSTRY TO CONDUCT AN INVESTIGATION ON THE FREQUENT SUDDEN UNINTENDED ACCELERATION (SUA) INCIDENTS INVOLVING MITSUBISHI MONTERO SPORT UTILITY VEHICLES, LARGELY DUE TO THE NEGLIGENCE IN PART OF THE DEPARTMENT OF TRADE AND INDUSTRY (DTI) TO CONDUCT SAFETY INSPECTIONS, WITH THE END IN VIEW OF NOT ONLY URGING DTI TO EXERCISE ITS AUTHORITY TO INVESTIGATE AND ORDER THE PULL OUT OF THE HEREIN MENTIONED VEHICLE MODEL IF PROVEN TO BE INJURIOUS, DANGEROUS AND UNSAFE, IN ACCORDANCE TO THE 1992 CONSUMER ACT, BUT ALSO URGING THE GOVERNMENT TO REGULATE, INSPECT AND INVESTIGATE MOTOR VEHICLE MANUFACTURERS AND DEALERS IN ACCORDANCE TO PUBLIC SAFETY"
