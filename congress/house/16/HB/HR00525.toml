title = "HR00525"
longTitle = "RESOLUTION URGING THE DEPARTMENT OF ENVIRONMENT AND NATURAL RESOURCES (DENR) TO IMMEDIATELY:\r\n(1) SUBMIT A PROGRESS REPORT ON THE CONCRETE ACTIONS IT HAD TAKEN TO DATE PURSUANT TO HOUSE RESOLUTION NOS. 757 AND 04 OF THE THIRTEENTH AND (2) SIXTEENTH CONGRESS, RESPECTIVELY;\r\nCONDUCT A DETAILED ENVIRONMENTAL IMPACT ASSESSMENT OF THE TAPIAN PIT, SAN ANTONIO PIT AND OTHER 'MINE STRUCTURES' AT THE MARCOPPER SITE ON THE BASIS OF NEW DEVELOPMENTS ON THE WORLDWIDE EFFECTS OF CLIMATE CHANGE BROUGHT ABOUT BY GLOBAL WARMING;\r\n(3) UNDERTAKE A CONCRETE ACTION AND/OR DISASTER RISK MANAGEMENT PROGRAM TO ENSURE THE SAFETY OF MARINDUQUE PROVINCE AND MARINDUQUEÑOS FROM FURTHER CATASTROPHIC EFFECTS IN THE EVENT THAT A 'YOLANDA' TYPE OR CATEGORY TYPHOON HITS THE PROVINCE; AND\r\n(4) MAKE AN ACCOUNTING OF THE REPORTED REHABILITATION FUND AMOUNTING TO $ 13 MILLION THAT PLACER DOME HAD ALLOCATED FOR MARINDUQUE PROVINCE"
