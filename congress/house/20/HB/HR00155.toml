longTitle = "A RESOLUTION DIRECTING THE DEPARTMENT OF BUDGET AND MANAGEMENT (DBM) AND THE DEPARTMENT OF AGRICULTURE (DA) TO JOINTLY DEVELOP AND OPERATE AN ONLINE PLATFORM FOR DIRECT PURCHASES FROM FARMERS AND FISHERFOLK REGISTERED IN THE REGISTRY SYSTEM FOR BASIC SECTORS IN AGRICULTURE (RSBSA), AND DIRECTING THE GOVERNMENT PROCUREMENT POLICY BOARD (GPPB) TO FORMULATE THE NECESSARY RULES TO ENABLE AND REQUIRE THE PROCUREMENT OF A MANDATORY PERCENTAGE OF FOOD REQUIREMENTS THROUGH SUCH PLATFORM, WITH RELAXED ENTRY AND PROCUREMENT RULES AND AFFORDABLE WAREHOUSE ACCESS, AS A MEASURE TO STRENGTHEN FOOD SECURITY PURSUANT TO SECTION 11 OF REPUBLIC ACT NO. 11321, OTHERWISE KNOWN AS THE \"SAGIP SAKA ACT\""
