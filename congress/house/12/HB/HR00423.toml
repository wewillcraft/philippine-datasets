title = "Settlement of Unreleased October 2000 Internal Revenue Allotment of Local Government Units (LGUs)"
longTitle = "RESOLUTION DIRECTING THE HOUSE COMMITTEE ON LOCAL GOVERNMENT AND OTHER APPROPRIATE COMMITTEES OF THE HOUSE OF REPRESENTATIVES TO LOOK INTO, IN AID OF LEGISLATION, DBM CIRCULAR 2002-4 DATED 11 JANUARY 2002, STRETCHING THE SETTLEMENT OF THE UNRELEASEDOCTOBER 2000 INTERNAL REVENUE ALLOTMENT (IRA) OF LOCAL GOVERNMENT UNITS (LGUs) FOR UP TO (6) SIX YEARS, AND ENROLLING THE SAME TO A PROMPT SETTLEMENT MECHANISM CALLED IRA MONETIZATION PROGRAM, DESIGNED TO ALLOW LGUs TO IMMEDIATELY COLLECT THE UNRELEASED AMOUNT, BUT AT A HUGE THIRTY PERCENT (30%) DISCOUNT, THEREBY EFFECTIVELY REDUCING THE INTERNAL REVENUE ALLOTMENT DUE MANY LGUs, IN POSSIBLE VIOLATION OF CONSTITUTIONAL AND STATUTORY PRESCRIPTIONS ON THE NATURE AND AUTOMATIC RELEASE OF THE IRA OFLGUs"
