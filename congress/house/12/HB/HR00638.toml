title = "Infiltrating the Ranks of the Rallyist on May 1 by Police Officers Carino and Castro"
longTitle = "RESOLUTION DIRECTING THE COMMITTEE ON PUBLIC ORDER AND SECURITY TO HOLD AN INVESTIGATION, IN AID OF LEGISLATION, INTO THE REPREHENSIBLE CONDUCT OF SENIOR POLICE OFFICER 1 (SPO1) JOCELYN V. CARINO AND HIS SUPERIOR, SUPERINTENDENT RENE L. CASTRO, BOTHWERE IN CIVILIAN CLOTHES, AND PNP-NCRPO DIRECTOR EDGARDO AGLIPAY, BY VIRTUE OF COMMAND RESPONSIBILITY, FOR INFILTRATING THE RANKS OF RALLYISTS DURING THE MAY 1 LABOR DAY RALLY AS PART OF THE PHILIPPINE NATIONAL POLICE'S INTELLIGENCE GATHERING EFFORTS IN WHICH SPO1 CARINO CARRIED A HANDGUN IN HIS WAISTBAND WHILE TAKING PICTURES OF RALLY LEADERS THEREBY SOWING FEAR AND ALARM AMONG THE RALLYISTS AND POSING A GRAVE THREAT TO THE RALLY LEADERS FROM THE KILUSING MAYO UNO (KMU), BAGONG ALYANSANG MAKABAYAN (BAYAN), AND BAYAN MUNA PARTY LIST INCLUDING REPRESENTATIVES CRISPIN `KA BEL' B. BELTRAN AND LIZA L. MAZA THUS SPO1 CARINO'S ACTIONS WERE ALSO IN BRAZEN ACTS OF DISRESPECT AGAINST THEM AS MEMBERS OF THE HOUSE OF REPRESENTATIVES"
