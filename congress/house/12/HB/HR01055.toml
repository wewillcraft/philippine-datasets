longTitle = "RESOLUTION OF THE MEMBERS OF THE HOUSE OF REPRESENTATIVES REPRESENTING THE FIFTY (50) LEGISLATIVE DISTRICTS OF MINDANAO, UPON THE INITIATIVE OF THE HONORABLE SPEAKER JOSE C. DE VENECIA JR., AUTHORIZING THE URGENT RELEASE OF FIVE MILLION PESOS (P5,000,000.00) EACH FROM OUR INDIVIDUAL ALLOCATION IN THE DPWH INFRASTRUCTURE PROGRAM UNDER THE GENERAL APPROPRIATIONS ACT FOR FISCAL YEAR 2003, EARNESTLY SEEKING COUNTERPART CONTRIBUTIONS IN THE SAME AMOUNT FROM THE BUDGET OF THE OFFICE OF THE PRESIDENTFOR THE USE OF THE AFP, PNP, AND/OR LGUs IN ORDER TO ENSURE EFFECTIVE PURSUIT OF THE GOVERNMENT'S CAMPAIGN AGAINST LAWLESSNESS IN MINDANAO, AND FOR THIS PURPOSE, CREATING THE `MINDANAO PEACE AND DEVELOPMENT FUND'"
