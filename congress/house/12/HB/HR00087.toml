title = "HR00087"
longTitle = "RESOLUTION URGING THE COMMISSION ON ELECTIONS (COMELEC) TO CONSIDER THE IMMEDIATE POSTPONEMENT OF THE DATE OF THE PLEBISCITE ON AUGUST 14, 2001 FOR THE APPROVAL OF THE AMENDMENTS TO REPUBLIC ACT NO. 6734 TO COINCIDE WH THE BARANGAY ELECTIONS TO BE HELD ON THE SECOND MONDAY OF MAY 2002 AND CONSEQUENTLY THE REGULAR ELECTIONS FOR ELECTIVE OFFICIALS OF THE AUTONOMOUS REGION IN MUSLIM MINDANAO TO BE HELD ON THE SECOND MONDAY OF AUGUST 2002 AND EVERY THREE (3) YEARS THEREAFTER, CONSIDERING THAT DUE TO THE LACK OF AN INFORMATION DISSEMINATION CAMPAIGN ON THE PART OF THE COMELEC, THE UNSTABLE PEACE AND ORDER SITUATION IN MINDANAO AND THE CALL OF THE ORGANIZATION OF ISLAMIC CONFERENCE (OIC) TO POSTONE THE GENERAL PLEBISCITE MAY CAUSE IRREPARABLE DAMAGE TO THE SEPTEMBER 1996 PEACE AGREEMENT BETWEEN THE PHILIPPINE GOVERNMENT (GRP) AND THE MORO NATIONAL LIBERATION FRONT, AND POSSIBLY PREEMPT THE OUTCOME OF CURRENT PEACE NEGOTIATIONS BETWEEN THE GRP AND MORO ISLAMIC LIBERATION FRONT (MILF)"
