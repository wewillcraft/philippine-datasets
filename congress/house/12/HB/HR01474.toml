title = "HR01474"
longTitle = "RESOLUTION URGING PRESIDENT GLORIA MACAPAGAL-ARROYO TO SUSPEND THE ISSUANCE OF A PENDING EXECUTIVE ORDER BASED ON A WORLD BANK-SPONSORED STUDY'S PROPOSED 'REFORMS' IN THE FINANCING POLICIES FOR THE WATER DISTRICTS AND OTHER WATER SERVICE PROVIDERS THAT WILL PAVE THE WAY FOR THE PRIVATIZATION OF WATER DISTRICTS NATIONWIDE AND VIRTUALLY ABOLISH THE (30)-YEAR OLD LOCAL WATER UTILITIES ADMINISTRATION (LWUA) WHICH WAS CREATED UNDER PRESIDENTIAL DECREE 198, AS SUCH EXECUTIVE ORDER WOULD NOT ONLY BE CONSTITUTIONALLY AND LEGALLY QUESTIONABLE BUT COULD RESULT IN COSTLY CONSEQUENCES FOR THE WATER-CONSUMING PUBLIC, ESPECIALLY THOSE IN THE COUNTRYSIDE, AS WELL AS THE MASS LAY-OFFS OF EMPLOYEES IN LWUA AND THE WATER DISTRICTS, AND ORDER THE HOLDING OF IMMEDIATE AND CONTINUING PUBLIC CONSULTATIONS WITH LWUA EMPLOYEES AND CONCERNED SECTORS"
