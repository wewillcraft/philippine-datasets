title = "Usurious Interests Being Charged to Credit Card Holders"
longTitle = "RESOLUTION DIRECTING THE COMMITTEE ON BANKS AND FINANCIAL INSTITUTIONS TO CONDUCT AN INQUIRY, IN AID OF LEGISLATION, INTO THE LENDING RATES BEING CHARGED CREDIT CARD HOLDERS BY CREDIT CARD COMPANIES, TO DETERMINE WHETHER OR NOT SUCH INTEREST IMPOSED ON CARD HOLDERS ARE CONSISTENT, WITH THE OFFICIAL OR AUTHORIZED LENDING RATES OF MAJOR LENDING BANKS OR WHETHER OR NOT THEY ARE UNJUST, UNREASONABLE, USURIOUS OR UNFAIR TO CARD HOLDERS, TAKING INTO ACCOUNT THE PRESENT STATE OF OUR ECONOMY, AND TO ADOPT MEASURES TO PROTECT THE PUBLIC FROM BEING VICTIMIZED BY UNCONSCIONABLE INTEREST RATES CHARGED BY CREDIT CARD COMPANIES, AND TO SAFEGUARD THE INTEREST OF DEPOSITORS OF BANKS WHICH INVEST THEIR FUNDS IN THE CREDIT CARD BUSINESS"
