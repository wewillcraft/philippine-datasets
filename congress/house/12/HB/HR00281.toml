title = "Legality of the Transfer of the Guarantee Fund for Small and Medium Enterprises (GFSME)"
longTitle = "RESOLUTION DIRECTING THE COMMITTEE ON AGRICULTURE, FOOD AND FISHERIES OF THE HOUSE OF REPRESENTATIVES TO CONDUCT AN INQUIRY, IN AID OF LEGISLATION, ON THE LEGALITY AND PROPRIETY OF THE TRANSFER OF THE GUARANTEE FUND FOR SMALL AND MEDIUM ENTERPRISES(GFSME), WHICH IS AN AGRICULTURE AND FISHERIES CREDIT GUARANTEE FUND AS PROVIDED IN THE AGRICULTURE AND FISHERIES MODERNIZATION ACT OF 1997, TO THE SMALL BUSINESS GUARANTEE AND FINANCE CORPORATION (SBGFC) PURSUANT TO EXECUTIVE ORDER NOS. 19 AND 28 ASTHIS WILL HAVE AN ADVERSE IMPACT ON THE AGRICULTURE, FISHERIES AND AGRIBUSINESS SECTORS AS WELL AS ON SBGFC EMPLOYEES WHO WILL SUFFER MASS LAY-OFFS AS A RESULT OF SUCH REORGANIZATION AND TO UNDERTAKE A REVIEW OF ALL LAWS, MEASURES AND JURISPRUDENCEPERTAINING TO THE SAME AND PENDING SUCH INQUIRY, TO HOLD IN ABEYANCE THE IMPLEMENTATION OF EXECUTIVE ORDER NOS. 19 AND 28, AND THEREAFTER PROVIDE THE HOUSE OF REPRESENTATIVES A REPORT OF ITS FINDINGS AND RECOMMENDATIONS"
