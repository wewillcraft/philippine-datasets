title = "HR01417"
longTitle = "RESOLUTION CALLING FOR AN IMMEDIATE STOP TO THE PUBLIC BIDDING OF THE WELFAREVILLE PROPERTY IN MANDALUYONG CITY AND THE PLANNED PHASE-OUT OF THE NATIONAL CENTER FOR MENTAL HEALTH LOCATED THEREIN, WHICH IS BEING DONE WITHOUT THE REQUISITE CONSULTATION PROCESS WITH AFFECTED SECTORS AND UNDER QUESTIONABLE BIDDING PRICES, AS THE EVENTUAL CLOSURE OF THE NATIONAL MENTAL HOSPITAL IN MANDALUYONG WILL MAKE PSYCHIATRIC CARE MORE INACCESSIBLE AND UNAFFORDABLE TO THE PEOPLE AND IMMEDIATELY RESULT IN DEPRIVING MUCH NEEDED HOSPITAL SERVICES FOR OVER 4,000 PATIENTS PRESENTLY CONFINED THERE AND 6,000 OUT-PATIENTS WHO SEEK TREATMENT EVERY MONTH, AS WELL AS DISPLACING 2,000 HOSPITAL PERSONNEL AND SOME 15,000 LONG-TIME RESIDENT FAMILIES OF WELFAREVILLE"
