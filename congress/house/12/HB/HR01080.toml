title = "HR01080"
longTitle = "RESOLUTION EXPRESSING THE SENSE OF THE HOUSE OF REPRESENTATIVES THAT THE ROAD TO CHANGE DOES NOT LIE IN AMENDING THE CONSTITUTION, WHETHER BY A CONSTITUENT ASSEMBLY OF CONGRESS OR THROUGH A CONSTITUTIONAL CONVENTION, AND THAT IT IS NEITHER NECESSARYNOR BENEFICIAL TO AMEND THE CONSTITUTION AT THE PRESENT TIME WHEN THE DELETERIOUS SWAY OF US-LED GLOBALIZATION AND MILITARY AGGRESSION CAN ONLY ERODE THE REMAINING PRO-FILIPINO PROVISIONS IN THE CHARTER WHICH EXIST TO PROTECT THE NATIONAL PATRIMONY,NATIONAL SOVEREIGNTY AND BASIC RIGHTS"
