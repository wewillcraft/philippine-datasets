longTitle = "RESOLUTION EXPRESSING THE DEEP CONCERN OF THE HOUSE OF REPRESENTATIVES OVER THE ISSUANCE BY A LOWER COURT OF A WRIT OF PRELIMINARY INJUNCTION WHICH EFFECTIVELY SUSPENDED THE IMPLEMENTATION OF REPUBLC ACT 8800, OR THE SAFEGUARD MEASURES ACT, AND WHICH IF NOT RESCINDED WOULD MAKE DOMESTIC INDUSTRIES AND AGRICULTURE ALREADY WEAKENED AND INJURED BY THE DUMPING OF IMPORTED PRODUCTS MORE VULNERABLE TO FINANCIAL LOSSES, CLOSURE OR BANKRUPTCY, DEVELOPMENTS WHICH WOULD RESULT IN THE MASSIVE LOSS OF JOBSAND REVENUE FOR THE CASH-STRAPPED GOVERNMENT AND DISSUADE FOREIGN ENTITIES FROM INVESTING IN THE PHILIPPINES DUE TO THE WHIMSICAL AND UNPREDICTABLE WAY BY WHICH THE COUNTRY'S TRADE AND BUSINESS LAWS ARE IMPLEMENTED"
