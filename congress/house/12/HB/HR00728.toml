title = "Terms of Reference Governing the Balikatan Joint Military Exercises"
longTitle = "RESOLUTION DIRECTING THE HOUSE COMMITTEES ON FOREIGN AFFAIRS, NATIONAL DEFENSE AND CIVIL, POLITICAL AND HUMAN RIGHTS, IN LINE WITH THE EXERCISE OF THE OVERSIGHT POWERS OF CONGRESS, TO UNDERTAKE A REVIEW AND ASSESSMENT OF THE IMPLEMENTATION OF THE TERMS OF REFERENCE GOVERNING THE RECENTLY CONCLUDED BALIKATAN JOINT MILITARY EXERCISES, INCLUDING THE TRUE EXTENT AND NATURE, AND HUMAN RIGHTS IMPLICATIONS OF SUCH EXERCISES, AND TO MAKE AN INQUIRY INTO THE LEGAL AND CONSTITUTIONAL BASIS OF THE CONTINUED PRESENCE OF U.S. MILITARY FORCES IN THE COUNTRY EVEN AFTER THE TERMINATION OF SAID EXERCISES ON JULY 31, 2002 AND TO THEREAFTER PROVIDE THE HOUSE OF REPRESENTATIVES A REPORT OF ITS FINDINGS AND RECOMMENDATIONS WHICH ARE NEEDED TO ENSURE COMPLIANCEWITH CONSTITUTIONAL GUARANTEES TO UPHOLD NATIONAL SOVEREIGNTY AND HUMAN RIGHTS"
