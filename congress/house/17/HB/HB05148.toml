longTitle = "AN ACT RENAMING THE ILOILO STATE UNIVERSITY OF SCIENCE AND TECHNOLOGY AS THE ILOILO STATE UNIVERSITY OF FISHERIES SCIENCE AND TECHNOLOGY AND EXTENDING THE DEADLINE FOR COMPLIANCE OF THE ILOILO STATE UNIVERSITY OF SCIENCE AND TECHNOLOGY INTO A STATE UNIVERSITY WITH THE REQUIREMENTS OF THE COMMISSION ON HIGHER EDUCATION, THEREBY AMENDING REPUBLIC ACT NO. 10604, ENTITLED: \\\"AN ACT  CONVERTING THE ILOILO STATE COLLEGE  OF FISHERIES IN THE MUNICIPALITY OF BAROTAC NUEVO, PROVINCE OF ILOILO INTO A STATE UNIVERSITY TO BE KNOWN AS THE ILOILO STATE UNIVERSITY OF SCIENCE AND TECHNOLOGY, WITH CAMPUSES IN THE MUNICIPALITIES OF SAN ENRIQUE, DINGLE AND DUMANGAS, AND INTEGRATING THEREWITH THE BAROTAC NUEVO POLYTECHNIC INSTITUTE IN THE MUNICIPALITY OF BAROTAC NUEVO ALL LOCATED IN THE PROVINCE OF ILOILO AND APPROPRIATING FUNDS THEREFOR\\\""
