title = "HR02363"
longTitle = "A RESOLUTION URGING THE DEPARTMENT OF FINANCE (DOF), BUREAU OF INTERNAL REVENUE (BIR) AND/OR THE SECURITIES AND EXCHANGE COMMISSION (SEC) TO IMMEDIATELY LIBERALIZE THE RULES AND REGULATIONS IMPLEMENTING REPUBLIC ACT NO. 9856, OTHERWISE KNOWN AS THE REAL ESTATE INVESTMENT TRUST (REIT) LAW OF 2009, WITH A VIEW TO SUCCESSFULLY LAUNCH AND   SUSTAIN THE REIT INDUSTRY IN THE PHILIPPINES AS ENVISIONED AND ORDAINED BY THE REIT ACT BY: (1) REFLECTING AND IMPLEMENTING THE VALUE ADDED TAX EXEMPTION FOR THE TRANSFER OF REAL PROPERTY FROM THE SPONSOR/S TO THE REIT IN ACCORDANCE WITH REPUBLIC ACT NO. 10963, OTHERWISE KNOWN AS  TAX  REFORM FOR ACCELERATION AND INCLUSION (TRAIN) LAW; (2) REMOVING THE ESCROW REQUIREMENT FOR REITS UNDER REVENUE REGULATION 13-2011; (3) RESTORING THE MINIMUM PUBLIC OWNERSHIP (MPO) REQUIREMENT TO ONE-THIRD (1/3) OF THE OUTSTANDING CAPITAL STOCK OF THE REIT AS INITIALLY FIXED BY THE REIT ACT; AND (4) ADOPTING OTHER MEASURES S MAY BE NECESSARY, SUCH AS AMENDING THE RULES GOVERNING PROPERTY AND FUND MANAGERS FOR REITS, IN ORDER TO SUSTAIN THE GROWTH OF THE REIT INDUSTRY IN THE PHILIPPINES"
