title = "HR01563"
longTitle = "RESOLUTION URGING THE HOUSE OF REPRESENTATIVES THRU THE COMMITTEE ON METRO MANILA DEVELOPMENT TO CONDUCT AN INQUIRY IN AID OF LEGISLATION INTO THE OBVIOUS AND OSTENTATIOUS DISPLAY OF ILLEGALITIES AND BRAZEN DISREGARD OF TRAFFIC LAWS COMMITTED IN THE MAJOR THOROUGH FARES AND SIDESTREETS OF METRO MANILA.\r\n\r\nTHESE FOREGOING ACTS HAVE BEEN TOLERATED, UNDER SUSPICIOUS CIRCUMSTANCES, BY THE LOCAL PNP, BY THE LAND TRANSPORTATION OFFICE (LTO), THE METRO MANILA DEVELOPMENT AUTHORITY (MMDA), THE HIGHWAY PATROL GROUP (HPG), ENFORCERS OF LGU'S AND OTHER AGENCIES TASKED TO REGULATE TRAFFIC, EASE CONGESTION, AND DETER CRIMINALITIES COMMITTED IN THE STREETS.\r\n\r\nIT IS INDEED INCUMBENT UPON THE HOUSE OF REPRESENTATIVES TO IMMEDIATELY UNDERTAKE AN INQUIRY IN AID OF LEGISLATION INTO THE POSSIBLE BREACH OF OBLIGATIONS, MALFEASANCE AND NONFEASANCE IN THE PERFORMANCE OF OFFICIAL DUTIES OF THE AFOREMENTIONED AGENCIES OF GOVERNMENT INCLUDING ITS OFFICERS, IN ORDER TO RECTIFY THE LOOMING CRISIS"
