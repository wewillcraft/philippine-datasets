title = "HR00711"
longTitle = "RESOLUTION DIRECTING THE DEPARTMENT OF AGRICULTURE (DA) THROUGH THE BUREAU OF FISHERIES AND AQUATIC RESOURCES (BFAR), IN AID OF LEGISLATION, TO IDENTIFY AND SUBMIT TO THE COMMITTEE ON AQUATIC AND FISHERIES RESOURCES OF THE HOUSE OF REPRESENTATIVES A LIST OF TWO (2) SPECIFIC AREAS IN EVERY REGION OF THE PHILIPPINES BOUNDED BY THE SEA THAT WILL BE RECOMMENDED FOR DEVELOPMENT INTO MARICULTURE PARKS AND CONSIDERED SPECIAL ECONOMIC ZONES ENTITLED TO INCENTIVES UNDER EXISTING LAWS WITHIN PRESCRIBED TERMS OF REFERENCES, AND FOR THE COMMITTEE ON AQUACULTURE AND FISHERIES RESOURCES, AFTER CONSULTATION WITH THE COMMITTEE ON APPROPRIATIONS, TO RECOMMEND BUDGETARY SUPPORT TO BE INCORPORATED EITHER IN THE GENERAL APPROPRIATIONS ACT, OR THROUGH A SUPPLEMENTAL APPROPRIATION OR INCLUDED IN FOREIGN-ASSISTED PROJECTS"
