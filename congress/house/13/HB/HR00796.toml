longTitle = "RESOLUTION DIRECTING THE COMMITTEE ON NATURAL RESOURCES TO INQUIRE AND INVESTIGATE, IN AID OF LEGISLATION, INTO THE ENGINE REPLACEMENT PROGRAM BEING UNDERTAKEN BY THE NATURAL RESOURCES DEVELOPMENT CORPORATION (NRDC), AS THE CORPORATE ARM OF THE DEPARTMENT OF ENVIRONMENT AND NATURAL RESOURCES (DENR) IN VIEW OF RECENT ALLEGATIONS SUPPOSEDLY COMING FROM NO LESS THAN THE FORMER EX-OFFICIO CHAIRMAN OF THE NRDC, RETIRED BRIG. GEN. VICTOR CORPUS, THAT THE CONTRACT ENTERED INTO UNDER THIS PROGRAM IS HIGHLY ANOMALOUS AND OVERPRICED, AS WELL AS, TO LOOK INTO THE NEGATIVE IMPACT OF THE CONFLICT BETWEEN THE NRDC CHAIR AND THE SECRETARY OF THE DENR ON THE GOVERNMENT'S REFORESTATION PROGRAM"
