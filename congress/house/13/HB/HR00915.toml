longTitle = "A RESOLUTION IN THE EXERCISE OF THE OVERSIGHT FUNCTION AND/OR IN AID OF AMENDATORY LEGISLATION, TO INQUIRE INTO THE IMPLEMENTATION BY THE DEPARTMENT OF TRADE AND INDUSTRY OF THE MANDATE TO OPERATIONALIZE THE BONDED EXPORT MARKETING BOARD (BEMB) PROVIDED UNDER SUBPARAGRAPH E, SECTION 13 OF EXECUTIVE ORDER 133, PROMULGATED ON 27 FEBRUARY 1987, IN ORDER TO ENABLE THE HOUSE OF REPRESENTATIVES TO CONDUCT AN IN-DEPTH EVALUATION, REVIEW AND INQUIRY THROUGH ITS OVERSIGHT COMMITTEE, IN COOPERATION WITH THE COMMITTEE ON TRADE AND INDUSTRY, TO DETERMINE THE UNDERLYING REASONS RELEVANT TO THE CONTINUOUS DEACTIVATION OF THE BONDED EXPORT MARKETING BOARD (BEMB), ITS SPECIFIC PROGRAMS, ACTIVITIES AND SERVICES, IN SPITE OF THE MANDATE OF EXISTING LAW TO OPERATIONALIZE, ACTIVATE AND CARRY-OUT THE FUNCTIONS OF THE BONDED EXPORT MARKETING BOARD (BEMB)"
