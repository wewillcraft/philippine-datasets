title = "HR00448"
longTitle = "RESOLUTION TO INVESTIGATE, IN AID OF LEGISLATION, THE TOTAL FOREIGN LOANS THAT HAVE BEEN INCURRED FOR REFORESTATION PROJECTS BY THE NATIONAL GOVERNMENT IN PREVIOUS ADMINISTRATIONS AND THAT OF THE INCUMBENT ADMINISTRATION  IF ANY, AND IN CONNECTION WITH SUCH INVESTIGATION THE DEPARTMENT OF ENVIRONMENT AND NATURAL RESOURCES AND THE DEPARTMENT OF FINANCE SHALL JOINTLY SUBMIT TO THE COMMITTEE ON NATURAL RESOURCES OF THE HOUSE OF REPRESENTATIVES A COMPREHENSIVE REPORT OF ALL LOANS THAT BEEN OBTAINED TO FUND REFORESTATION AND FORESTRY-RELATED PROJECTS, THE PAYMENTS ALREADY MADE AND THE BALANCE OF OUTSTANDING LOANS THAT REMAIN TO BE AMORTIZED; AS WELL AS TO SUBMIT AN EVALUATION REPORT OF THE RESULTS OF THE IMPLEMENTATION OF SAID PROJECTS; AND AFTER RECEIPT OF SUCH REPORTS, THE COMMITTEE ON NATURAL RESOURCES SHALL CONDUCT HEARINGS WITH A VIEW TO MAKING AN IN-DEPTH ASSESSMENT AND EVALUATION OF THE RESULTS OF THE REFORESTATION AND FORESTRY-RELATED PROJECTS, THE ISSUES, PITFALLS AND CONCERNS THAT HAVE BEEN ENCOUNTERED IN THE IMPLEMENTATION OF SAID PROJECTS; AND THEREAFTER FOR THE COMMITTEE ON NATURAL RESOURCES TO SUBMIT LEGISLATIVE REFORM MEASURES TO INSURE THAT  REFORESTATION PROJECTS AND OTHER FORESTRY-RELATED ACTIVITIES SHALL HEREAFTER BE UNDERTAKEN IN A PROPER AND TECHNICALLY EFFICIENT MANNER, AND THAT SANCTIONS FOR BREACHES OF CONTRACTS, VIOLATION OF STIPULATED REFORESTATION AGREEMENTS AND SUBSTANDARD PERFORMANCE OF UNDERTAKINGS ARE DULY PENALIZED"
