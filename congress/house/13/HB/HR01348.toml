title = "HR01348"
longTitle = "RESOLUTION DIRECTING THE COMMITTEE ON INFORMATION AND COMMUNICATIONS TECHNOLOGY TO CONDUCT AN INQUIRY, IN AID OF LEGISLATION, ON THE DIRECTIVE FOR ALL CELLULAR PHONES TO BE REGISTERED WITH THE NATIONAL TELECOMMUNICATIONS COMMISSION (NTC), TO ASCERTAIN WHETHER NTC CAN HANDLE THE REGISTRATION OF MORE THAN 35 MILLION CELLULAR PHONES WITHOUT INCONVENIENCING THE PUBLIC AND CAUSING UNDUE FINANCIAL BURDEN ON CELL PHONE OWNERS, WHETHER THE PROPOSED CELL PHONE REGISTRATION WILL NOT VIOLATE THE PRIVACY AND CIVIL RIGHTS OF THE CELL PHONE OWNERS AND MAKE IT EASIER TO ILLEGALLY WIRETAP TARGET INDIVIDUALS AND WHETHER IT WOULD INDEED HELP IN FIGHTING CRIMES AND PROTECTING NATIONAL SECURITY WITHOUT SACRIFICING THE PEOPLE'S RIGHT TO FREE COMMUNICATIONS, AND WHETHER EXISTING PERTINENT LAWS ARE INADEQUATE"
