title = "HR00676"
longTitle = "RESOLUTION DIRECTING THE SPECIAL COMMITTEE ON OVERSEAS WORKERS AFFAIRS AND THE COMMITTEE ON FOREIGN AFFAIRS TO CONDUCT A JOINT INVESTIGATION, IN AID OF LEGISLATION, INTO THE STATUS OF ABUSED FILIPINA OVERSEAS WORKERS STRANDED AT THE PHILIPPINE EMBASSY IN AMMAN, JORDAN, INCLUDING THE HIGHLY QUESTIONABLE PRACTICE OF RETURNING FILIPINA DOMESTIC WORKERS TO ABUSIVE EMPLOYERS AND RECRUITMENT AGENCIES BEING DONE BY EMBASSY OFFICIALS, URGING THE DEPARTMENT OF FOREIGN AFFAIRS TO PUT A STOP TO THIS PRACTICE AND TO EXPEDITIOUSLY EFFECT THE IMMEDIATE REPATRIATION OF ALL STRANDED WORKERS IN JORDAN TO THE PHILIPPINES, AND THE ADMINISTRATIVE AND CRIMINAL LIABILITY OF THE PHILIPPINE OVERSEAS EMPLOYMENT ADMINISTRATION FOR THE CONTINUED DEPLOYMENT OF DOMESTIC WORKERS DESPITE A LONGSTANDING AND STILL EXISTING DEPLOYMENT BAN TO JORDAN"
