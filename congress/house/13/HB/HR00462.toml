title = "HR00462"
longTitle = "RESOLUTION DIRECTING THE COMMITTEE ON SCIENCE AND TECHNOLOGY OF THE HOUSE OF REPRESENTATIVES TO INVESTIGATE, IN AID OF LEGISLATION, THE TECHNICAL CAPABILITY OF THE PHILIPPINE ATMOSPHERIC, GEOPHYSICAL AND ASTRONOMICAL SERVICES ADMINISTRATION (PAGASA) FOR WEATHER FORECASTING AND MONITORING, DISSEMINATION OF EARLY WARNING SIGNALS, AND ASSESSMENT OF THE IMPACT OF TROPICAL DEPRESSION, STORM SURGES, TYPHOONS AND OTHER DISTURBANCES, IN ORDER TO ASSESS AND RECOMMEND REMEDIAL MEASURES, INCLUDING PROVISION OF CORRESPONDING FUNDING SUPPORT, TO ENABLE PAGASA TO RENDER MORE EFFECTIVE, EFFICIENT AND TIMELY SERVICES. THE IMPERATIVE NECESSITY OF THIS INVESTIGATION IS HEREIN PROPOSED BECAUSE OF THE PUBLIC CLAMOR TO CONDUCT THIS INQUIRY AS AN AFTERMATH OF THE DEVASTATING EFFECTS OF THE RECENT SERIES OF TROPICAL DEPRESSIONS AND TYPHOONS OCCURING IN LATE NOVEMBER TO EARLY DECEMBER, 2004 (NAMELY, \\\"WINNIE\\\", \\\"UNDING\\\", \\\"VIOLETA\\\" AND YOYONG\\\")"
