longTitle = "RESOLUTION DIRECTING THE COMMITTEE ON NATIONAL DEFENSE TO CONDUCT AN INQUIRY, IN AID OF LEGISLATION, ON THE ALLEGED \\\"WITHDRAWAL OF SUPPORT\\\" EXPRESSED BY ARMY BRIGADIER GENERAL DANILO LIM OF THE ARMED FORCES OF THE PHILIPPINES IN A RECORDED VIDEO TAPE RECENTLY AIRED BY THE MEDIA, AND TO SUMMON GENERAL DANILO LIM, FORMER AMBASSADOR ROY SEÑERES, FORMER CHIEF OF STAFF ANGELO REYES, ET AL., WITH A VIEW TO DETERMINING WHETHER THE TERM \\\"WITHDRAWAL OF SUPPORT\\\" IS ADEQUATELY DEFINED IN THE STATUTE BOOKS, AND INQUIRING AS WELL INTO THE ROLE OF THE AFP AS \\\"PROTECTOR OF THE PEOPLE\\\" AND HOW WELL AFP OFFICERS AND ENLISTED PERSONNEL HAVE BEEN REGIMENTED ON THE CONSTITUTIONAL PRINCIPLE OF \\\"SUPREMACY OF CIVILIAN AUTHORITY OVER THE MILITARY\\\"."
