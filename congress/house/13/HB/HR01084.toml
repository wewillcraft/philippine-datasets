longTitle = "A RESOLUTION IN THE EXERCISE OF ITS OVERSIGHT POWERS AND/OR IN AID OF LEGISLATION FOR THE HOUSE OF REPRESENTATIVES TO INQUIRE INTO THE STATUS OF IRRIGATION PROJECTS AND/OR TO INVESTIGATE THE DISPOSITION OF APPROPRIATED FUNDS PROCEEDS OF LOANS, OR OTHER DEVELOPMENT ASSISTANCE OBTAINED BY OR PROVIDED TO THE NATIONAL IRRIGATION ADMINISTRAATION (NIA) AND IN ACCORDANCE HEREWITH, TO DIRECT THE COMMITTEE ON FOOD AND AGRICULTURE JOINTLY WITH THE COMMITTEE ON OVERSIGHT OF THE HOUSE OF REPRESENTATIVES TO CONDUCT SUCH INQUIRIES AND INVESTIGATIONS AS ARE RELEVANT TO THE  DETERMINATION OF ADEQUACY OR INADEQUACY OF IRRIGATION SYSTEMS INCLUDING THE BUDGETARY AND/OR FINANCIAL ASSISTANCE PROVIDED TO OR BEING USED BY THE NATIONAL IRRIGATION ADMINISTRATION (NIA) FOR THE CONSTRUCTION, OPERATION AND MAINTENACE OF IRRIGATION SYSTEMS ESSENTIAL TO THE MODERNIZATION OF AGRICULTURE IN THE PHILIPPINES"
