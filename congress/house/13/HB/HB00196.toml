title = "Maritime and Ocean Affairs Center Act of 2002\\\". The State recognizes that marine resources and environment, including those of the oceans, all seas, archipelagic waters and adjacent coastal areas, form an integrated whole that are essential components of the national ocean economy and life-support system vital to sustainable development. This measure seeks the creation of the Maritime and Ocean Affairs Center (MOAC) which shall serve as the secretariat to the Department of Foreign Affairs on maritime and ocean affairs matters. Among its other functions, the MOAC shall initiate steps to harmonize and update domestic legislation and rules and regulations with international agreements to which the Philippines is a party."
