longTitle = "RESOLUTION URGING THE SECURITIES AND EXCHANGE COMMISSION (SEC) TO SUSPEND THE IMPLEMENTATION OF THE ACTUARIAL RESERVE LIABILITY (ARL) REQUIREMENT FOR PRE-NEED COMPANIES PENDING CONSULTATION WITH THE CONCERNED SECTORS TO ARRIVE AT A NEW FORMULA, RESTORE THEIR LICENSE TO SELL TO EASE THEIR CASH FLOW, REQUIRE COLEGE ASSURANCE PLAN (CAP) AND PACIFIC PLANS, INC. (PPI) TO UPDATE ALL THEIR PAST-DUE OBLIGATIONS WITH THEIR PLANHOLDERS WITHIN THE 12-MONTH PERIOD FOLLOWING THE RESTORATION OF THEIR LICENSE TO SELL AND TO COMPEL THE COLLEGE ASSURANCE PLAN AND THE PACIFIC PLANS, INC. TO HOLD IN ESCROW THEIR TRUST FUND ASSETS AND PLACE THE PROCEEDS THEREOF IN A RESERVE TO MEET THEIR MATURING OBLIGATIONS TO PLANHOLDERS"
