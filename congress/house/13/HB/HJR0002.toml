title = "Creating a Congressional Commission to Review and Assess the Debt Policies, Strategies and Programs of the Country."
longTitle = "JOINT RESOLUTION CREATING A CONGRESSIONAL COMMISSION TO REVIEW AND ASSESS THE DEBT POLICIES, STRATEGIES AND PROGRAMS OF THE PHILIPPINES, CONDUCT A PUBLIC AUDIT OF ALL LOANS ACQUIRED, INCLUDING ASSUMED AND CONTINGENT LIABILITIES, VALIDATE THE UTILIZATION OF LOAN PROCEEDS, AND THE PAYMENTS MADE THEREON, AND RECOMMEND POLICIES AND STRATEGIES TO REDUCE DEBT SERVICE AS WELL AS INSTITUTIONAL AND INFRASTRUCTURAL MEASURES TO ENSURE SOUND FISCAL AND MONETARY STATUS OF THE NATIONAL GOVERNMENT PRINCIPALLY THROUGH EFFECTIVE DEBT MANAGEMENT"
