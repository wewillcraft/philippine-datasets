title = "HR00757"
longTitle = "OMNIBUS RESOLUTION URGING THE DEPARTMENT OF ENVIRONMENT AND NATURAL RESOURCES (DENR) TO IMMEDIATELY:\r\n(1)  FILE A CLASS SUIT IN BEHALF OF ALL MARINDUQUENOS AND THE NEXT GENERATION OF MARINDUQUENOS AGAINST PLACER DOME, INC. AND MARCOPPER MINING CORPORATION, IN A COUNTRY WHERE JURISDICTION CAN BE HAD, FOR THE EXTENSIVE DAMAGE IT HAS CAUSED TO THE PROVINCE OFMARINDUQUE AND TO THE COUNTRY'S ECOSYSTEMS;\r\n\r\n(2) ENLIST THE SUPPORT OF U.N. AGENCIES AND ENVIRONMENTALIST GROUPS/NGOS TO HELP THEM IN SUCCESSFULLY PROSECUTING THIS CASE;\r\n\r\n(3)  ISSUE AN ORDER TO WITHHOLD MARCOPPER'S OPERATION OR PARTICIPATION IN THE MINING INDUSTRY, IF ANY, IN THE PHILIPPINES UNTIL, SAID COMPANIES COMPLETE THEIR REHALIBATATION OF MARINDUQUE;\r\n\r\n(4)  DISQUALIFY PLACER DOME, ITS AFFILIATES AND ANY COMPANY WHERE PLACER DOME HAS AN INTEREST IN FROM ANY FUTURE PARTICIPATION IN THE MINING OPERATIONS BY FOREIGN MINING COMPANIES IN THE PHILIPPINES PENDING THE SATISFACITION OF CLAIMS BY THE SUIT'S PETITIONERS AND BY THE PHILIPPINE GOVERNMENT"
