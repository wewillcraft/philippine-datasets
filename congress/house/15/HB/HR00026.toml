longTitle = "A RESOLUTION DIRECTING THE COMMITTEE ON TRADE AND INDUSTRY OF THE HOUSE OF REPRESENTATIVES TO INQUIRE INTO, REVIEW AND EVALUATE, IN AID OF LEGISLATION THE CURRENT STATUTORY AND REGULATORY FRAMEWORK THAT GOVERNS THE LICENSING, GRANTING AND OPERATION OF BUSINESS FRANCHISES IN ORDER TO ENSURE THAT FRANCHISE SCAMS ARE DETERRED AND ALTOGETHER AVOIDED AND THEREBY PRESERVE AND ENHANCE THE INTEGRITY, REPUTATION AND GOODWILL OF FRANCHISES OF SPECIFIC BRANDS, PRODUCTS AND SERVICES AS VIABLE ENTERPRISE OPPORTUNITIES AND AFTER DUE HEARING OF THE COMMITTEE ON TRADE AND INDUSTRY TO RECOMMEND SPECIFIC REMEDIAL MEASURES AND ADOPT FAIR FRANCHISING STANDARDS THAT PROMOTE RESPONSIBLE FRANCHISING AND THEREBY PREVENT UNSCRUPULOUS PRACTICES"
