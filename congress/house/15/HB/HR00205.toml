longTitle = "RESOLUTION URGING THE HOUSE OF REPRESENTATIVES THRU THE COMMITTEE ON GOOD GOVERNMENT JOINT WITH THE COMMITTEE ON PUBLIC WORKS AND HIGHWAYS TO IMMEDIATELY CONDUCT AN INQUIRY IN AID OF LEGISLATION INTO THE ISSUES THAT SURROUND THE ANOMALOUS INCIDENTS CONCERNING THE METROPOLITAN WATERWORKS AND SEWERAGE SYSTEM (MWSS), SPECIFICALLY THE ALLEGED EXCESSIVE COMPENSATION OF THE DIRECTORS AND OFFICIALS, THE ATTEMPT OF THE NEW DPWH SECRETARY TO TAKEOVER THE CHAIRMANSHIP OF MWSS WHEN HIS ASSUMING SAID POSITION IS FOUND TO BE A CONFLICT OF INTEREST, HIS ALLEDE ATTEMPT TO HAVE AN APPROVAL FROM THE MWSS TO OPERATE THE CONCESSION IN PAGCOR CITY WHEN HE WAS STILL THE MANAGER OF THE PRIVATE WATER COMPANY, MAYNILAD, WHERE SUCH DEALINGS WAS CONSIDERED A MIDNIGHT DEAL AND ALSO TO DETERMINE THE BOUNDARIES OF EACH CONCESSIONAIRE, WHERE ALLEGATIONS OF OVERLAPPING WAS RAISED IN A NEWS REPORT IN A DAILY NEWSPAPER AND FINALLY TO FIND OUT IF THESE OFFICIALS HAVE COMMITTED GRAFT AND CORRUPTION IN THE COURSE OF PERFORMING THEIR DUTIES"
