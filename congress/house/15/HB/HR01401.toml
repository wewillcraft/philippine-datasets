longTitle = "RESOLUTION TO EXPRESS THE SENSE OF THE HOUSE THAT IT SUPPORTS AND IS IN SOLIDARITY WITH THE STATEMENT OF THE EXECUTIVE BRANCH THAT WITH RESPECT TO CHINA'S INTRUSIONS IN PHILIPPINE WATERS SINCE FEBRUARY THIS YEAR, THE FOLLOWING LONG ESTABLISHED PRINCIPLE IS BEING AGGRESSIVELY VIOLATED: \\\"THE RULE OF LAW IS THE BEDROCK OF PEACE, ORDER AND FAIRNESS IN MODERN SOCIETIES. THE RISE OF A RULES-BASED INTERNATIONAL SYSTEM HAS BEEN THE GREAT EQUALISER IN GLOBAL AFFAIRS. RESPECT AND ADHERENCE TO INTERNATIONAL LAW HAVE PRESERVED PEACE AND RESOLVED CONFLICTS. INTERNATIONAL LAW HAS GIVEN EQUAL VOICE TO NATIONS REGARDLESS OF POLITICAL, ECONOMIC OR MILITARY STATURE, BANISHING THE UNLAWFUL USE OF SHEER FORCE..WE EXPECT NOTHING LESS FROM OUR INTERNATIONAL PARTNERS...\\\""
