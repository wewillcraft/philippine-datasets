title = "HR00036"
longTitle = "A RESOLUTION MANDATING THE COMMITTEE ON HEALTH OF THE HOUSE OF REPRESENTATIVES TO CONDUCT AN INVESTIGATION, IN AID OF LEGISLATION, TO DETERMINE AFTER A REVIEW, EVALUATION AND IN-DEPTH ANALYSIS OF PRESCRIPTION AND NON-PRESCRIPTION DRUGS WHICH HAVE BEEN EITHER RECALLED, WITHDRAWN, BANNED, OR ARE IN LITIGATION OR SUBJECT OF NUMEROUS LAWSUITS AGAINST THE DRUG MANUFACTURERS OR GIVEN A \\\"BLACK BOX\\\" WARNING IN OTHER COUNTRIES BUT WHICH ARE STILL BEING PRESCRIBED AND SOLD IN THE PHILIPPINE IN ORDER TO ENABLE THE PHILIPPINE  GOVERNMENT TO ESTABLISH SAFEGUARDS AND CLOSE MONITORING OF SAID PROHIBITED DRUGS TO PROTECT THE FILIPINO CITIZENRY FROM THE RISKS OF HARMFUL AND DEADLY SIDE-EFFECTS AND URGING THE BUREAU OF FOOD AND DRUGS (BFAD) UNDER THE DEPARTMENT OF HEALTH TO RESEARCH AND COMPILE A MORE COMPREHENSIVE LIST OF THESE BANNED PRESCRIPTION AND NON-PRESCRIPTION DRUGS IN OTHER COUNTRIES WHICH ARE PROLIFERATING IN THE PHILIPPINE MARKET, IN ORDER THAT THESE DRUGS WILL LIKEWISE BE BANNED IN THE PHILIPPINES"
