longTitle = "A RESOLUTION DIRECTING THE COMMITTEE ON HIGHER AND TECHNICAL EDUCATION OF THE HOUSE OF REPRESENTATIVES TO INQUIRE INTO AND INVESTIGATE, IN AID OF LEGISLATION, THE EXISTING STATUTORY AND ADMINISTRATIVE POLICY FRAMEWORKS GOVERNING THE REGULATION OF DISTANCE EDUCATION IN ITS VARIOUS METHODS AND APPLICATIONS, BE THEY THROUGH RADIO, TELEVISION, MAIL CORRESPONDENCE,INTERNET, OR OTHER E-LEARNING DEVICES, WITH A VIEW TO INSTITUTING REFORMS IN QUALIFICATION OR ACCREDITATION STANDARDS FOR VENDORS OF DISTANCE EDUCATION COURSES OR PROGRAMS INCLUDING CURRICULUM DESIGN, SUBJECT CONTENT FOR DEGREE AND NON-DEGREE COURSES, PRESCRIBED TEACHING AND LEARNING METHODOLOGIES, OPERATIONAL INFRASTRACTURE FOR PROGRAM DELIVERY AND STUDENT RESPONSE, AND TESTING AND ASSESSMENT REQUIREMENTS"
