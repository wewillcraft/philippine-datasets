title = "Interference Of N E A And Its Authority Over D A N E C O"
longTitle = "Rep. Cresente C. Paez...spoke about the alarming situation in the Davao del Norte Electric Cooperative (Daneco) which was operating with two sets of directors, general managers, employees, and collection groups; stressed that the Cooperative Dev't Authority (CDA) is the sole gov't body mandated to promote the viability and growth of cooperatives...but noted severa blatant attempts of the NEA to abort the registration of the Daneco with the CDA and its possible conversion into a stock cooperative; denounced the continuous control and manipulation by the NEA of the said electric cooperative; stated that he filed a Resolution ...on the matter and urged the gov't agencies concerned to let electric cooperatives grow and realize their full potentials..."
