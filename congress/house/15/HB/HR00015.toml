title = "HR00015"
longTitle = "A RESOLUTION DIRECTING THE DEPARTMENT OF AGRICULTURE (DA) IN COORDINATION WITH THE DEPARTMENT OF ENVIRONMENT AND NATURAL RESOURCES (DENR) TO IDENTIFY AREAS FOR PILOT PLANTATIONS OF NOT LESS THAN ONE HUNDRED HECTARES EACH, IN APPROPRIATE REGIONS OF THE COUNTRY, WHICH CAN BE DONE EITHER IN ALIENABLE AND DISPOSABLE PUBLIC LANDS OR LOGGED-OVER AREAS IN DENUDED FOREST LANDS, IN ORDER TO ESTABLISH EXPERIMENTAL STATIONS THAT WILL PROPAGATE SUCH PLANTS WITH POTENTIAL ESSENTIAL OILS EXTRACTS AS ILANG-ILANG, SAMPAGUITA, PANDAN (\\\"SCREW PINE\\\"), TANGLAD (\\\"LEMONGRASS\\\"), PATCHOULI, CITRONELLA OR VETIVER, AND TO SUBMMIT TO THE COMMITTEE ON AGRICULTURE AND THE COMMITTEE ON NATURAL RESOURCES OF THE HOUSE OF REPRESENTATIVES THE REPORT ON THE IDENTIFIED AREAS AS AFORESTATED, IN ORDER FOR THE HOUSE OF REPRESENTATIVES TO CONDUCT HEARINGS TO DETERMINE APPROPRIATE LEGISLATIVE MEASURES THAT MAY BE ENACTED TO ENSURE THAT THE DEVELOPMENT OF THE ESSENTIAL OILS INDUSTRY IN THE PHILIPPINES SHALL BE SUPPORTED AND AIDED BOTH AS AN IMPORT-SUBSTITUTION AND EXPORT-ORIENTED INDUSTRY"
