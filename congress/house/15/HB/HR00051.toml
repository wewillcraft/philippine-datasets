title = "HR00051"
longTitle = "A RESOLUTION MANDATING AN INVESTIGATION, IN AID OF LEGISLATION, FOR THE PURPOSE OF IDENTIFYING, REVIEWING, AND CONDUCTING AN IN-DEPTH ANALYSIS OF THE COMMON TOXIC INGREDIENTS USED IN SKINCARE, PERSONAL-CARE AND COSMETIC PRODUCTS WHICH HAVE BEEN SHOWN BY RESEARCH STUDIES TO BE HAZARDOUS TO HEALTH AND/OR HAVE BEEN RESTRICTED AND/OR BANNED BY GOVERNMENT AGENCIES IN OTHER COUNTRIES BUT WHICH ARE STILL BEING DISTRIBUTED BY COMPANIES IN THE PHILIPPINES, AND - TO THEREBY ENABLE THE PHILIPPINE GOVERNMENT TO ESTABLISH SAFEGUARDS AND CLOSE MONITORING OF SUCH HARMFUL,TOXIC INGREDIENTS TO PROTECT THE GENERAL PUBLIC FROM THE ADVERSE HEALTH HAZARDS AND OTHER RISKS OF SIDE-EFFECTS IN ORDER FOR SUCH TOXIC INGREDIENTS IF FOUND NECESSARY TO BE LIKEWISE RESTRICTED OR BANNED IN THE PHILIPPINES"
