longTitle = "A RESOLUTION URGING THE COMMITTEE ON GOOD GOVERNMENT AND PUBLIC ACCOUNTABILITY TO CONDUCT AN INQUIRY, IN AID OF LEGISLATION, ON THE RECENTLY CONCLUDED ACCREDITATION PROCEEDINGS OF THE LAND TRANSPORTATION FRANCHISING & REGULATORY BOARD (LTFRB) FOR THE PASSENGER PERSONAL ACCIDENT INSURANCE (PPAI) PROGRAM AND TO DETERMINE, AMONG OTHERS, THE COMPLIANCE OF THE SPECIAL BIDS AND AWARDS COMMITTEE (SBAC) OF THE LTFRB TO CURRENT RULES AND REGULATIONS RELATIVE TO THE CONDUCT OF ACCREDITATION PROCEEDINGS, FOR THE PURPOSE OF CRAFTING AND INSTITUTIONALIZING ADDITIONAL AND NECESSARY SAFEGUARDS IN THE ACCREDITATION PROCESS CURRENTLY MAINTAINED BY GOVERNMENT AGENCIES AND TO ENSURE THAT MEMBERS OF BID AND AWARDS COMMITTEES (BACs) AND OTHERS INVOLVED IN GOVERNMENTAL PROCUREMENT PROCESS FAITHFULLY ADHERE TO CURRENT LAWS AND STANDARDS"
