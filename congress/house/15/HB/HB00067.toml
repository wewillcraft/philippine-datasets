title = "The Philippine Moringa Research And Development Authority (pmrda)"
longTitle = "AN ACT ESTABLISHING THE PHILIPPINE MORINGA RESEARCH AND DEVELOPMENT AUTHORITY (PMRDA) TO ENABLE THE GOVERNMENT TO SUPPORT, OVERSEE AND ASSIST THE STRATEGIC, COORDINATED AND COMPREHENSIVE DEVELOPMENT PROGRAM OF THE MORINGA (MALUNGGAY) INDUSTRY IN ALL ITS ASPECTS; AND TO ENHANCE THE CAPACITIES AND SOCIO-ECONOMIC WELFARE OF MORINGA FARMERS, PRODUCERS, BY-PRODUCT MANUFACTURERS AND ALL THOSE DIRECTLY AND INDIRECTLY ENGAGED IN ALL ASPECTS OF THE MORINGA INDUSTRY BY ASSISTING AND PROVIDING EDUCATION, SERVICE, DEVELOPMENT, FINANCING, GATHERING INDUSTRY INFORMATION/PRODUCER AND CONSUMER INFORMATION, RESEARCH PROMOTION, AND TO DEVELOP GLOBALLY COMPETITIVE PRODUCTS REQUIRED TO MAINTAIN NATIONAL SELF SUFFICIENCY AND EXPORT CAPACITY MARKETS FOR MORINGA AND MORINGA BY-PRODUCTS"
