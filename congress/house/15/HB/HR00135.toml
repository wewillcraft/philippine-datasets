title = "HR00135"
longTitle = "A RSOLUTION TO INQUIRE, IN AID OF LEGISLATION, ON THE STATUS OF THE IMPLEMENTATION OF REPUBLIC ACT NO. 8172 (RA8172) WHICH MANDATES SALT IODIZATION NATIONWIDE, OTHERWISE KNOWN AS THE ASIN LAW, WITH THE VIEW TO DETERMINING THE EFFECTIVENESS OF THE LAW TO PREVENT IODINE DEFICIENCY DISORDERS, TO DETERMINE THE SCOPE AND DEGREE OF COMPLIANCE IN THE USE OF IODIZED SALT SINCE ITS ENACTMENT, TO EXAMINE AND REVIEW THE HEALTH HAZARDS, IF ANY, THAT MAY HAVE OCCURRED DUE TO GAPS, GLITCHES AND DEFICIENCIES IN THE FORMULATION OF QUALITY ASSURANCE STANDARDS AND IN THE MONITORING AND ENFORCEMENT OF THE IMPLEMENTING GUIDELINE OF THE PROVISIONS OF THE LAW ADOPTED BY THE CONCERNED GOVERNMENT AGENCIES AND THE ISSUES THAT HAVE ARISEN THEREFROM, AND DIRECTING THE COMMITTEE ON HEALTH OF THE HOUSE OF REPRESENTATIVES TO CONDUCT HEARINGS THEREON AND TO SUBMIT WITHIN NINETY (90) DAYS FROM RECEIPT OF THIS RESOLUTION, ITS REPORT, DETAILING THE PROS AND CONS, ADVANTAGES AND DISADVANTAGES, AND THE BENEFICIAL AND INJURIOUS MEDICAL AND HEALTH SIDE EFFECTS OF THE SAID ASIN LAW, IF ANY BE DETERMINED"
