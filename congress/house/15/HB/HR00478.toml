title = "HR00478"
longTitle = "RESOLUTION URGING THE HOUSE OF REPRESENTATIVES THRU THE COMMITTEE ON TRANSPORTATION TOGETHER WITH THE COMMITTEE ON GOOD GOVERNMENT TO IMMEDIATELY CONDUCT AN INQUIRY IN AID OF LEGISLATION INTO THE ISSUES THAT SURROUND THE ANOMALOUS GRANT BY THE DEPARTMENT OF TRANSPORTATION AND COMMUNICATIONS (DOTC) AND THE LAND TRANSPORTATION OFFICE (LTO) TO A CERTAIN COMPANY, TO SUPPLY DRIVERS' LICENSES TO BE ISSUED TO DRIVERS FOR A FEE WITHOUT A CONTRACT AND IN CLEAR VIOLATION OF LAW. FURTHER, THE COMMITTEE ON TRANSPORTATION AND THE COMMITTEE ON GOOD GOVERNMENT SHOULD ALSO LOOK INTO THE CULPABILITY OF THOSE GOVERNMENT OFFICIALS IN THE TRANSPORTATION SECTOR WHO WERE INVOLVED IN THE PREPARATION OF THE TERMS OF REFERENCE AND BID DOCUMENTS WHICH WERE ALLEGED TO FAVOR A CERTAIN BIDDER TO THE EXCLUSION OF OTHER BIDDERS AND TO DETERMINE IF THERE IS A WAY WHERE DOTC AND LTO CAN PROCURE LICENSES AT A CHEAPER MEANS AND IMPROVE THE QUALITY AT THE SAME TIME, AND LASTLY, TO FIND OUT  IF HOW MUCH HAS THE NATIONAL GOVERNMENT BEEN SUBSIDIZING THE LAND TRANSPORTATION FOR THE PROCUREMENT OF LICENSES FOR SO MANY YEARS"
