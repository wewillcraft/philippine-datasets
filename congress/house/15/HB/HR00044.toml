title = "HR00044"
longTitle = "A RESOLUTION DIRECTING THE DEPARTMENT OF HEALTH (DOH), THROUGH THE PHILIPPINE INSTITUTE OF TRADITIONAL AND ALTERNATIVE HEALTH CARE (PITAHC) AND ITS BUREAU OF FOOD AND DRUG (BFAD), IN COOPERATION WITH THE DEPARTMENT OF AGRICULTURE (DA), THE PHILIPPINE COUNCIL FOR AGRICULTURE, FORESTRY AND NATURAL RESOURCES RESEARCH AND DEVELOPMENT (PCARRD), AN ATTACHED AGENCY OF THE DEPARTMENT OF SCIENCE AND TECHNOLOGY (DOST), AND THE CENTER FOR INTERNATIONAL TRADE EXPOSITIONS AND MISSIONS (CITEM), AN ATTACHED AGENCY OF THE DEPARTMENT OF  TRADE AND INDUSTRY (DTI), TO FORMULATE A STRATEGIC NATIONAL PROGRAM TO DEVELOP AND PROMOTE PRIORITY MEDICINAL PLANTS, PRODUCTS AND BY-PRODUCTS THAT HAVE SOCIO-ECONOMIC IMPACT AND HEALTH BENEFITS, THAT INCLUDES A PROPOSED PROGRAM FOR THE COMMERCIAL CULTIVATION FOR THE COMMERCIAL CULTIVATION OF SUCH MEDICINAL PLANTS AND THE ESTABLISHMENT OF PILOT DEMONSTRATION PROJECTS FOR THE PROPAGATION AND PROCESSING OF SUCH MEDICINAL PLANTS TO BE RUN BY A NATIONAL GOVERNMENT AGENCY AND SUPPORTED BY A NETWORK OF SMALL AND MEDIUM SCALE PLANTATIONS OPERATED BY THE PRIVATE SECTOR, AND TO SUBMIT SUCH STRATEGIC NATIONAL PROGRAM TO THE APPROPRIATE COMMITTEES OF THE HOUSE OF REPRESENTATIVES, IN AID OF THE COMMITTEES OF THE HOUSE OF REPRESENTATIVES, IN AID OF LEGISLATIVE MEASURES THAT SHALL BE DRAFTED AND ENACTED IN SUPPORT OF THE DEVELOPMENT OF THE MEDICINAL PLANTS INDUSTRY"
