title = "HR00061"
longTitle = "A RESOLUTION MANDATING, IN AID OF LEGISLATION, THE REVIEW AND IN-DEPTH ANALYSIS OF COCONUT SUGAR AS A NATURAL AND HEALTHY SWEETENER AND URGING THE PHILIPPINE COCONUT AUTHORITY (PCA) UNDER THE DEPARTMENT OF AGRICULTURE, THE FOOD AND NUTRITION INSTITUTE OF THE PHILIPPINES (FNRI) UNDER THE DEPARTMENT OF SCIENCE AND TECHNOLOGY AND THE BUREAU OF FOOD AND DRUG (BFAD) UNDER THE DEPARTMENT OF HEALTH TO SUBJECT THE COCONUT SUGAR TO TWO  (2) INTERNATIONAL TESTING AS FOLLOWS: (1) LOW GLYCEMIC IN-VIVO HUMAN CLINICAL STUDY (FOR DIABETICS); (2) LOW GLYCEMIC  IN VIVO HUMAN CLINICAL STUDY (FOR NON-DIABETICS) WITH THE GLYCEMIC RESEARCH LABORATORY BASED IN THE USA, THE ONLY OFFICIAL GLYCEMIC TESTING FACILITY THAT IS APPROVED BY THE US FEDERAL GOVERNMENT AND ENDORSED BY BOTH THE CANADIAN AND UK GOVERNMENTS TO VALIDATE THE PHILIPPINE-BASED STUDIES SHOWING COCONUT SUGAR AS A LOW GLYCEMIC NATURAL SWEETENER"
