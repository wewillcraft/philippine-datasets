longTitle = "RESOLUTION URGING THE COMMITTEE ON ENERGY TO IMMEDIATELY CONDUCT AN INVESTIGATION, IN AID OF LEGISLATION, ON THE TRUTHFULNESS OF THE STATEMENTS OF THE POWER SECTOR ASSETS AND LIABILITIES MANAGEMENT CORPORATION'S (PSALM) THAT THE SALE OF THE REMAINING MAJOR ASSETS OF THE NATIONAL POWER CORPORATION (NAPOCOR) INCLUDING THE UNIFIED LEYTE GEOTHERMAL POWER PLANTS, CASECNAN HYDROELECTRIC POWER PLANT AND THE AGUS-PULANGI HYDROELECTRIC POWER COMPLEX WILL REDOUND TO THE UTMOST BENEFIT OF THE GOVERNMENT IN PARTICULAR AND THE RURAL ENERGY CONSUMERS IN GENERAL AND REQUIRE THE FULL, TRANSPARENT AUDIT OF NAPOCOR AND PSALM OPERATIONS AND CASH FLOWS IN ORDER FOR THE SAID CORPORATIONS TO PUBLICLY DISCLOSE THE DISBURSEMENT OF THEIR FUNDS AND UTILIZATION OF THE PROCEEDS OF PRIVATIZED NAPOCOR ASSETS"
