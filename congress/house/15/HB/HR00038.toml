longTitle = "A RESOLUTION MANDATING AN INVESTIGATION IN AID OF LEGISLATION, FOR THE PURPOSE OF IDENTIFYING, REVIEWING AND CONDUCTING AN IN-DEPTH ANALYSIS OF THE COMMON TOXIC FOOD ADDITIVES WHICH HAVE BEEN SHOWN BY RESEARCH STUDIES TO BE DAMAGING TO HEALTH AND/OR HAVE BEEN RESTRICTED OR BANNED BY GOVERNMENT AGENCIES IN OTHER COUNTRIES BUT ARE STILL BEING USED BY COMPANIES IN THE PHILIPPINES - TO ENABLE THE PHILIPPINE GOVERNMENT TO ESTABLISH SAFEGUARDS AND CLOSE MONITORING OF THE USE OF SUCH HARMFUL, TOXIC FOOD INGREDIENTS TO PROTECT THE GENERAL PUBLIC FROM THE ADVERSE HEALTH HAZARDS AND OTHER NEGATIVE SIDE EFFECTS IN ORDER FOR SUCH TOXIC FOOD ADDITIVE INGREDIENTS TO BE LIKEWISE RESTRICTED OR BANNED IN THE PHILIPPINES"
