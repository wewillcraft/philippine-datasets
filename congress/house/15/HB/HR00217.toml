title = "HR00217"
longTitle = "A RESOLUTION TO INQUIRE, IN AID OF LEGISLATION, INTO THE IMPLEMENTATION OF THE PROVISIONS OF REPUBLIC ACT NO. 7941, OTHERWISE KNOWN AS THE PARTY-LIST SYSTEM ACT, THE ADMINISTRATIVE IMPLEMENTATION OF SOME OF ITS PROVISIONS MAY HAVE BEEN EFFECTIVELY MODIFIED OR CLARIFIED BY SUPREME COURT DECISIONS AND SOME PROVISIONS OF THE IMPLEMENTING RULES AND REGULATIONS OF WHICH MAY HAVE BEEN DECLARED VOID AB INITIO OR UNCONSTITUTIONAL BY DECISIONS OF THE SUPREME COURT AS A RESULT OF CONTROVERSIES AND POLICY DISPUTES THAT HAVE ARISEN THEREFROM, AND TO DIRECT THE COMMITTEE ON SUFFRAGE AND ELECTORAL REFORMS TO CONDUCT HEARINGS THEREON AND TO SUBMIT ITS REPORT AND RECOMMENDATIONS WITHIN ONE HUNDRED TWENTY (120) DAYS FROM RECEIPT OF THIS RESOLUTION IN ORDER THAT AMENDATORY LEGISLATION MAY BE CONSIDERED, IF DETERMINED TO BE APPLICABLE, APPROPRIATE OR NECESSARY FOR THE GUIDANCE OF THE STAKEHOLDERS IN THE PARTY-LIST SYSTEM"
