title = "HR00718"
longTitle = "RESOLUTION URGING THE HOUSE OF REPRESENTATIVES TO INQUIRE INTO THE POSSIBLE ANOMALIES BY OFFICIALS OF THE PHILIPPINE AMUSEMENT AND GAMING CORPORATION (PAGCOR) IN CONNIVANCE WITH OWNERS, SHAREHOLDERS AND MANAGERS OF HOTELS, AMUSEMENT CENTERS AND SIMILAR ESTABLISHMENTS FOR ENTERING INTO CONTRACTS TO OPERATE CASINOS WHEREBY PAGCOR ABDICATED ITS OBLIGATION AND DUTY UNDER THE LAW AND ONLY PLAYS A MINOR ROLE BY ENTRUSTING OR GRANTING THE CONTROL AND MANAGEMENT OF THE OPERATION OF SAID CASINOS TO THE SAID ESTABLISHMENTS, THAT SUCH AN ARRANGEMENT VIOLATES THE PURPOSE AND SPIRIT OF THE LAW THAT CREATED PAGCOR, WHICH PROVIDES THAT PAGCOR MAY OPERATE A CASINO IN JOINT VENTURE WITH OTHERS OR MAY RECEIVE INVESTMENT FROM OTHERS TO PUT UP A CASINO, HOWEVER, MANAGEMENT AND CONTROL OF SUCH CASINOS WILL REMAIN WITH PAGCOR"
