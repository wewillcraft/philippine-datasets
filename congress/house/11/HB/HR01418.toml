longTitle = "RESOLUTION CALLING FOR AN INQUIRY, IN AID OF LEGISLATION, ON THE DANGER AND HAZARDS POSED TO THE POPULATION AND ENVIRONMENT BY THE LEAKING PIPELINES OF OIL COMPANIES AND OTHER INDUSTRIES ENGAGED IN THE MANUFACTURE AND DISTRIBUTION OF FLAMMABLE AND HAZARDOUS CHEMICALS AND SUBSTANCES; AND PENDING THE COMPLETION OF THE INQUIRY, FOR THE IMMEDIATE SUSPENSION OF PERMITS ISSUED RELATIVE TO THE UTILIZATION OF THESE PIPELINES AS A MODE OF TRANSPORTING SAID FUELS, CHEMICALS AND SUBSTANCES, SUCH AS THE BATANGAS- MANILA (`BATMAN') PETROLEUM PIPELINE OPERATED BY SHELL PHILIPPINES INCLUDING THE IMMEDIATE REVOCATION OF THE ENVIRONMENTAL COMPLIANCE CERTIFICATE OBTAINED BY SHELL PHILIPPINES EXPLORATION CORPORATION FOR ITS NATURAL GAS PIPELINE THAT WILL CONDUCT NATURAL GAS FROM PALAWAN TO BATANGAS DUE TO NON-COMPLIANCE WITH REPUBLIC ACT NO. 7611"
