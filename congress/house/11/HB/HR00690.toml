longTitle = "RESOLUTION EXPRESSING THE ARDENT SUPPLICATION OF THE HOUSE OF REPRESENTATIVES TO HIS EXCELLENCY, PRESIDENT JOSEPH EJERCITO ESTRADA, FOR THE INSTITUTION OF AN EXPANDED VERSION OF THE BALIKBAYAN AND REUNION FOR PEACE PROGRAMS, SHOWCASING THE SAME PERKS, BENEFITS, PRIVILEGES AND INCENTIVES OF THE ORIGINAL PROGRAMS, TO SERVE AS THE TWIN FLAGSHIP SPECIAL TOURISM PROJECTS OF THE DEPARTMENT OF TOURISM IN THE CELEBRATION OF THE NEW MILLENIUM, THEREBY PROPOSING FOR THE PURPOSE THE ISSUANCE OF AN EXECUTIVE DECREE, ORDER OR INSTRUCTION, AS THE CASE MAY BE, SEEKING THE CREATION AND CONVENING OF A PRESIDENTIAL TASK FORCE OR COORDINATING COMMITTEE TO BE COMPOSED OF HEADS OF CONCERNED EXECUTIVE DEPARTMENTS THAT WILL TACKLE THE VARIOUS DETAILS, DEVISE PLANS AND LAY THE GROUNDWORK THAT WOULD BRING ABOUT THE OBJECTIVES OF THESE PROGRAMS"
