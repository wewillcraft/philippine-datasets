longTitle = "RESOLUTION ENJOINING THE COMMITTEE ON LABOR AND EMPLOYMENT AND THE COMMITTEE ON FOREIGN AFFAIRS TO CONDUCT AN INQUIRY, IN AID OF LEGISLATION, INTO THE SAD PLIGHT OF NINETY-TWO OVERSEAS FILIPINO WORKERS (OFWs) WHO HAD BEEN LANGUISHING IN CHUNGLI CITY, TAIWAN, DUE TO NON-PAYMENT OF THEIR MONTHLY WAGES, AND; TO INVESTIGATE, DETERMINE AND ASSESS THE WORKING CONDITIONS OF OTHER OFWs WHO, AS ALLEGED BY THE SAME WORKERS, WERE SUBJECTED TO UNCONSCIONABLE AND INHUMAN WORK PRACTICES BY THEIR EMPLOYERS, THEREBY ALSO NECESSITATING A REVIEW OF THE POWERS, MANDATE AND PERFORMANCE OF THE MANILA ECONOMIC AND CULTURAL OFFICE WHICH IS BASED THEREIN IN ATTENDING AND ASSISTING TO THE NEEDS OF OUR HAPLESS OFWs MIRED IN SORRY INCIDENTS OF THIS NATURE"
