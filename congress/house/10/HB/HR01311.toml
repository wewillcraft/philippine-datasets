title = "HR01311"
longTitle = "RESOLUTION DIRECTING THE COMMITTEE ON ENERGY TO CONDUCT AN INQUIRY, IN AID OF LEGISLATION, INTO THE PRICING POLICIES AND DECISIONS OF THE OIL COMPANIES SINCE THE IMPLEMENTATION OF FULL DEREGULATION UNDER THE OIL DEREGULATION ACT (REPUBLIC ACT NO. 8180) FOR THE PURPOSE OF DETERMINING IN THE CONTEXT OF THE OVERSIGHT FUNCTIONS OF CONGRESS WHETHER THE CONDUCT OF THE OIL COMPANIES, WHETHER SINGLY OR COLLECTIVELY, CONSTITUTES 'CARTELIZATION' WHICH IS A PROHIBITED ACT UNDER R.A. NO. 8180, AND WHAT MEASURES SHOULD BE TAKEN TO HELP ENSURE THE SUCCESSFUL IMPLEMENTATION OF THE LAW IN ACCORDANCE WITH ITS LETTER AND SPIRIT, INCLUDING RECOMMENDING CRIMINAL PROSECUTION OF THE OFFICERS CONCERNED OF THE OIL COMPANIES IF WARRANTED BY THE EVIDENCE, AND FOR OTHER PURPOSES"
