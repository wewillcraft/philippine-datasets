longTitle = "RESOLUTION DIRECTING THE COMMITTEE ON JUSTICE TO CONDUCT A PROBE AND INVESTIGATION, IN AID OF LEGISLATION, ON THE MANNER, HANDLING AND PROCEDURE FOLLOWED BY THE PNP COMMAND IN THE PROVINCE OF CAVITE RELATIVE TO THE ELECTION PROTEST CASES ON THE MAYORALTY POSTS OF THE TOWNS OF MENDEZ, NAIC AND TERNATE, AND TO RECOMMEND MEASURES TO ENSURE THAT JUSTICE IS NOT MISCARRIED BY THE PNP UNDER THE GUISE OF COMPLYING WITH COURT ORDERS, AS WELL AS TO LOOK INTO THE QUESTIONABLE ACTS COMMITTED BY JUDGES ANDCOURT PERSONNEL BEYOND THE RULES OF COURT AND JUDICIAL PROCEDURE WITH THE END IN VIEW OF HAVING THE JUDICIARY REVISE THEM IN SUCH A WAY SO AS TO CURTAIL ABUSES AND ACTS BEYOND JURISDICTION BY UNCRUPULOUS JUDGES"
