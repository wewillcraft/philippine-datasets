title = "HR00208"
longTitle = "RESOLUTION DIRECTING THE COMMITTEE ON FOREIGN AFFAIRS TO CONDUCT AN INVESTIGATION, IN AID OF LEGISLATION, INTO THE SAD PLIGHT OF FILIPINAS WHO HAVE GONE ABROAD TO WORK, ESPECIALLY THOSE IN KUWAIT, FOUR OF WHOM HAVE BEEN REPORTED TO HAVE COMMITTED SUICIDE, AND THOSE IN NIGERIA WHO WERE REPORTEDLY FORCED INTO PROSTITUTION AND DIRECTING THE SAME COMMITTEE TO LOOK INTO THE ACTIONS TAKEN BY VARIOUS GOVERNMENT AGENCIES TO ADDRESS THE FILIPINA WORKERS' PROBLEMS WITH THE END IN VIEW OF GIVING THEM JUSTICE, ENSURING THEIR PROTECTION AND THE IMMEDIATE AND SAFE REPATRIATION OF THOSE REPORTEDLY STILL LEFT LANGUISHING IN SEX SLAVERY IN NIGERIA AND OTHER DISTRESSED FILIPINA WORKERS ABROAD, AND TO REVIEW EXISTING LAWS AND GOVERNMENT POLICIES ON OVERSEASWORKERS, ILLEGAL RECRUITMENT AND THE PROTECTION OF FILIPINO NATIONALS ABROAD AND RECOMMEND MEASURES TO ADDRESS THE CONCERNS AND PROBLEMS OF FILIPINO MIGRANT WORKERS"
