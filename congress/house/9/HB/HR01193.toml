longTitle = "RESOLUTION EXPRESSING THE SENSE OF THE HOUSE OF REPRESENTATIVES REQUESTING PRESIDENT FIDEL V. RAMOS TO INSTRUCT THE MEMBERS OF THE PHILIPPINE DELEGATION TO THE UN INTERNATIONAL CONFERENCE ON POPULATION AND DEVELOPMENT (UCPD) IN CAIRO, EGYPT, IN SEPTEMBER 1994, TO ADHERE TO AND UPHOLD THE PHILIPPINE CONSTITUTION PROVISIONS THAT THE STATE SHALL PROTECT EQUALLY THE LIFE OF THE MOTHER AND THE LIFE OF THE UNBORN CHILD FROM CONCEPTION, AND THE SANCTITY OF THE FAMILY AS THEY PARTICIPATE IN THE DELIBERATIONS ON THE DRAFT PROGRAMME OF ACTION OF THE ICPD"
