title = "HR00040"
longTitle = "RESOLUTION REQUESTING THE PRESIDENT OF THE REPUBLIC OF THE PHILIPPINES TO PROCLAIM NOVEMEBER 30 OF EACH YEAR AS A NATIONAL DAY OF PRAYER AND RENEWAL WHERE ALL GOD-FEARING PEOPLES IN THE LAND MAY GATHER TOGETHER IN THEIR HOMES AND PLACES OF WORSHIP AND IN THEIR RESPECTIVE WAYS, PRAY FOR THE FORGIVENESS OF OUR SINS, RENEWAL OF THE NATION AND GOD'S BLESSINGS UPON OUR COUNTRY AND PEOPLE ESPECIALLY OUR CHILDREN, AND IN PREPARATION FOR THE NATIONAL DAY OF PRAYER, LEAD THE FILIPINO PEOPLE , IN A WEEKLY PRAYER, PREFERABLY EVERY MONDAY MORNING, FOR NATIONAL AFFIRMATION OF FAITH IN GOD, ATONEMENT FOR OUR FAILINGS, RENEWAL OF VALUES, RECONCILIATION, PEACE AND UNITY, AND ECONOMIC RECOVERY AND PROSPERITY, IMPLORING FOR THE PURPOSE, THE AID OF ALMIGHTYGOD, AS ENSHRINED IN OUR CONSTITUTION"
