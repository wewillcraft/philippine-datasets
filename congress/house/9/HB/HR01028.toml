longTitle = "RESOLUTION DIRECTING THE COMMITTEE ON NATURAL RESOURCES TO CONDUCT AN INQUIRY, IN AID OF LEGISLATION, INTO THE REPORTS THAT, ALTHOUGH THE PHILIPPINES USED TO BE BLESSED WITH DIVERSE SPECIES OF WILDLIFE, OFFICIAL FORESTRY STATISTICS INDICATE THAT DUETO THE CONTINUING DESTRUCTION OF WILDLIFE HABITATS AS WELL AS EXCESSIVE AND INDISCRIMINATE HUNTING AND OTHER LAND DEVELOPMENT ACTIVITIES, MANY SPECIES HAVE BECOME RARE AND ARE, IN FACT, SERIOUSLY THREATENED/ENDA NGERED, AND TO REVIEW THE EXISTING PROGRAMS, POLICIES AND GUIDELINES BEING IMPLEMENTED BY CONCERNED GOVERNMENT AGENCIES WITH REGARDS TO CONSERVATION OF SUCH SPECIES, AND TO RECOMMEND SUCH OTHER REMEDIAL MEASURES AS MAY BE NECESSARY TO PROTECT OUR WILDLIFE HABITATS"
