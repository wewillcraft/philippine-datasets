title = "HR00061"
longTitle = "RESOLUTION URGING THE PRESIDENT OF THE PHILIPPINES TO CREATE A NEW DEBT NEGOTIATION PANEL TO BE COMPOSED OF THREE MEMBERS, ONE OF WHOM SHALL BE FROM THE GOVERNMENT AND THE TWO FROM THE PRIVATE SECTOR WITH THE PARTICIPATION OF ONE (1) REPRESENTATIVEFROM EACH HOUSE OF CONGRESS, WHICH PANEL SHALL ADOPT AND EMPLOY ALL DIPLOMATIC INITIATIVES TO PERSUADE COUNTRIES OF OUR CREDITOR BANKS TO ASSIST OUR GOVERNMENT IN ACHIEVING ECONOMIC PROGRESS AND STABILITY BY CONVINCING THE CREDITOR BANKS TO ACCEPT DEBT SERVICE PAYMENTS AT THE RATE OF TWELVE PERCENT (12%) OF OUR COUNTRY'S TOTAL MERCHANDISE TRADE OR COMMODITY EXPORT RECEIPTS FOR EVERY FISCAL YEAR OR OTHER FORMS OF VIABLE DEBT RELIEF SUCH AS CONDONATION AND/OR DEFERMENT OF PRINCIPAL AND/OR INTERESTFOR A SPECIFIED PERIOD"
