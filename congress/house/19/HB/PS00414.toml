title = "Address Of Speaker Ferdinand Martin G. Romualdez"
longTitle = "ADDRESS OF SPEAKER FERDINAND MARTIN G. ROMUALDEZ: Speaker Romualdez stated that he was compelled\r\nto address not only the accusations hurled against him\r\nbut also the recent admission of Vice President Sara\r\nDuterte of contacting an assassin to harm President\r\nFerdinand Romualdez Marcos Jr., First Lady Liza\r\nAraneta-Marcos, and himself. He said that the statement\r\nwas reckless, dangerous, and unprecedented; a direct\r\nthreat to democracy, governance, and national security;\r\nand not only a personal affront but also an attack on the\r\nfoundations of the government and the rule of law. The\r\nSpeaker pointed out that the gravity of the confession\r\ncould not be passed as mere rhetoric and demanded\r\naccountability and answers."
