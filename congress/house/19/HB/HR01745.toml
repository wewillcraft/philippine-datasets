longTitle = "A RESOLUTION DIRECTING THE APPROPRIATE HOUSE COMMITTEES, TO CONDUCT AN\r\nINVESTIGATION, IN AID OF LEGISLATION, IN COORDINATION WITH THE RELEVANT GOVERNMENT AGENCIES AND BODIES, SUCH AS BUT NOT LIMITED\r\nTO THE COMMISSION ON HUMAN RIGHTS (CHR), DEPARTMENT OF THE INTERIOR AND LOCAL GOVERNMENT (DILG), DEPARTMENT OF JUSTICE (DOJ), AND PHILIPPINE NATIONAL POLICE (PNP) AND RELATED OFFICIALS OF ALL PERTINENT LOCAL GOVERNMENT UNITS (LGUS) AND THEIR RESPECTIVE LOCAL CHIEF EXECUTIVES PARTICULARLY THE CITIES OF MANILA, CEBU CITY, QUEZON CITY AND ALL THOSE WHO ARE IDENTIFIED TO HAVE BEEN INVOLVED OR HAS AN ALLEGED HISTORY OF CASES OF EXTRAJUDICIAL KILLINGS AND POSSIBLE HUMAN RIGHTS VIOLATIONS IN THEIR RESPECTIVE AREAS OF RESPONSIBILITIES FOR A PERIOD COVERING THE LAST TWENTY-FIVE (25) YEARS UNTIL THE PRESENT"
