longTitle = "ADDRESS OF SPEAKER ROMUALDEZ (F.M.) \r\nSpeaker Romualdez (F.M.) emphasized the extensive deliberations and negotiations to pass the 2024 national budget in a timely manner which reflected the overarching target toward inclusivity and sustainability, in line with the Marcos administration´s Medium-Term Fiscal Framework, the 8-Point Socioeconomic Agenda, and the 2023-2028 Philippine Development Plan; and ensured the constitutional requirement of transparency and accountability, especially in the use of CIFs.  He cited the eight measures that became laws since the start of the current regular session.\r\n"
