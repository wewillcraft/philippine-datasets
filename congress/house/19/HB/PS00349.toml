title = "Speech Of Minority Leader Libanan"
longTitle = "SPEECH OF MINORITY LEADER LIBANAN \r\nMinority Leader Libanan expressed his deep appreciation and gratitude to the Body for finishing the First Regular Session of the 19th Congress with remarkable achievements.  He said that despite their differences in opinions and beliefs, they have found creative solutions to address the issues at hand, have worked successfully together, and have achieved noteworthy results. \r\nHe stressed that through the competent stewardship and democratic leadership of Speaker Romualdez, who had efficiently shepherded fiscal policies that pushed for high growth, economic transformation, and technological reforms, they were able to express and raise the issues and concerns of the underprivileged, marginalized, and neglected sectors of society, and translate their discussions into meaningful policies and concrete actions.\r\n"
