title = "Address Of Speaker Romualdez ( F. M.)"
longTitle = "ADDRESS OF SPEAKER ROMUALDEZ (F.M.) \r\nSpeaker Romualdez expressed his utmost gratitude for the Body´s prodigious performance and monumental output and enumerated the composition of legislative measures approved by the House and added that the 17 priority measures outlined by the President in his second SONA) were also approved.\r\nHe mentioned that all the LEDAC priority measures targeted for passage were approved three months ahead of schedule, and that the national budget was passed on time with enough fund allocations for each district to bring needed assistance and comfort to the citizenry. \r\nThe Speaker demonstrated its resolve to address issues that impact the Filipinos by exercising its oversight functions and scrutinizing government operations, conducting legislative inquiries in aid of legislation, engaging its counterparts in the Executive Department in open and honest discussions, gathering reliable information, and offering immediate recommendations on pressing economic issues. \r\n"
