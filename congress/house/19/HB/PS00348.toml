title = "Message Of Speaker Romualdez ( F. M.)"
longTitle = "MESSAGE OF SPEAKER ROMUALDEZ (F.M.) \r\nSpeaker Romualdez first welcomed the Members back to the remainder of the First Regular Session of the 19th Congress.  He then relayed to the Body that he accompanied President Ferdinand R. Marcos Jr. to his trip to the United States for meetings with President Joseph R. Biden Jr., Vice President Kamala D. Harris, Defense Secretary Lloyd James Austin III, and high-ranking executives of the Central Intelligence Agency. He described the trip as most productive and successful where, in conjunction with the Executive, the Legislature had helped in furthering and enhancing the relationship between the Philippines and U.S.\r\n"
