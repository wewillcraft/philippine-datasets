longTitle = "ADDRESS OF SPEAKER ROMUALDEZ \r\nSpeaker Romualdez underscored the gains of the 19th Congress which followed a legislative program aligned with the priority measures that aims to institute public policies geared to fully revitalize the country´s pandemic-ravaged economy through job creation, equal economic opportunities for all, and ensure food on the table of every Filipino family. \r\nThe Speaker added that the House of Representatives had passed several priority measures that were designed to alleviate poverty, sustain economic progress, and harness competencies in government for it to be able to deliver the highest degree of service to the Filipino people.\r\n"
