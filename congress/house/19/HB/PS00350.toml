title = "Address Of Speaker Romualdez ( F. M.)"
longTitle = "ADDRESS OF SPEAKER ROMUALDEZ (F.M.) \r\nSpeaker Romualdez commended his colleagues for their untiring support and collective efforts to fulfill the aspirations of the Filipino people.  He said that the House approved on Third Reading 33 out of 42 priority measures, with three already signed into law.\r\nThe Speaker lauded the Committee on Agriculture and Food for it inquiry on the surge in the price of onions and other agricultural products.  He took pride with the launching of the eCongres, a digital platform intended to facilitate knowledge and information exchange between the two Houses.\r\nHe commended the Committee on Ethics and Privileges for taking up the call for disciplinary action against Rep. Teves (A.) and thanked his colleagues for their individual and collective efforts to donate funds to victims of natural disasters and to provide financial assistance to people affected by the Mindoro oil spill and severe Tropical Storm Paeng, as well as for supporting the President on his official visit to the US.\r\n"
