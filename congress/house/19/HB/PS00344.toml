title = "Address Of Speaker Romualdez"
longTitle = "ADDRESS OF SPEAKER ROMUALDEZ\r\nSpeaker Romualdez recognized the immediate and collective action of the Members in passing bills and resolutions, including priority bills that aim to resuscitate the pandemic-batterred economy and make economic transformation the main engine to uplift the lives of the Filipino people. \r\nSpeaker Romualdez highlighted the historic adoption of HCR No. 2 which expressed the collective support and commitment of the House to the 2022-2028 Medium-Term Fiscal Framework.  He underscored the detailed scrutiny of the Minority bloc and the tireless cooperation of the Executive department for the immediate approval on Third Reading of HB No. 4488 or the proposed â‚±5.268 trillion national spending plan for 2023.\r\nSpeaker Romualdez also said that the recent visit of the US President has made a solid and strong investment pitch to the American business community of the commitment of the Philippine House of Representatives to enact laws that would deepen the cooperation between the two countries, particularly in the areas of the supply chain, health and security, environment and climate change, energy security, and interconnectivity.\r\n"
