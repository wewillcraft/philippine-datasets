title = "Address Of Speaker Ferdinand Martin G. Romualdez"
longTitle = "ADDRESS OF SPEAKER FERDINAND MARTIN G. ROMUALDEZ: Speaker Romualdez commended his colleagues,\r\nthe Deputy Speakers, Majority Leader Dalipe, and\r\nMinority Leader Libanan, for their high spirits not only\r\nfor understanding the country´s goals and priorities\r\nbut for translating them into tangible and beneficial\r\nchanges and maintaining significant progress. He\r\nsaid that once again, the Body demonstrated its\r\nlegislative efficiency and tireless efforts to strengthen\r\nthe Philippine economy, broaden the range of public\r\nservice, and reinforce the nation´s trust in governance,\r\nand showed that Congress is an institution of action\r\nand change."
