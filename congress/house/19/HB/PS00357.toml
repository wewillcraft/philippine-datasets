title = "Address Of Speaker Romualdez ( F. M.)"
longTitle = "ADDRESS OF SPEAKER ROMUALDEZ (F.M.)\r\n Speaker Romualdez talked about and/or expressed concerns over the following matters:\r\na. The Body´s 100 percent target completion of the 20 LEDAC´s priority measures\r\nb. laws that will fortify the country´s national defense and enhance international security posture\r\nc. the historic trilateral meeting among Pres. Ferdinand R. Marcos Jr., U.S. President Joe Biden, and Japanese Prime Minister Fumio Kishida\r\nd. strengthening defense and economic cooperation between the Philippines and the United States\r\ne. U.S. Bill which will allocate $500 million in foreign military financing to the Philippines\r\nf. OCTA Research survey which indicated a decrease in self-rated poverty and hunger among Filipino families\r\ng. collective efforts to control inflation and increase household income\r\nh. development agenda initiatives in healthcare, education, and digital infrastructure\r\ni. secret “gentleman´s agreement” between former Pres. Duterte and Chinese President Xi Jinping regarding the West Philippine Sea\r\nj. upholding territorial integrity and sovereignty in accordance with the Constitution and international law. \r\nk. implementation of the National Cybersecurity Plan and to protect sensitive information\r\nl. fortifying the country´s cybersecurity command to ensure the safety of institutions and citizens against cyber threats. \r\nm. widening gap between farmgate and retail prices of rice and other basic goods to protect the interests of farmers and consumers while deterring profiteering\r\n"
