title = "Address Of Speaker Romualdez ( F. M.)"
longTitle = "ADDRESS OF SPEAKER ROMUALDEZ (F.M.) \r\nSpeaker Romualdez stated that the House will end another calendar year with remarkable accomplishments owing to the collective efforts and commendable dedication of the Members as they continue to produce landmark legislation designed to strengthen the country´s economy, revitalize businesses, and widen the scope of services for the Filipino people.  \r\nSpeaker Romualdez mentioned the successful passage ahead of schedule of 20 measures that were identified as priorities by the LEDAC, four of which were enacted into law.  He reported with great pride the passage of all 17 priority measures mentioned by the President in his second SONA and further emphasized the enactment of additional notable laws.\r\n"
