title = "Address Of Speaker Ferdinand Martin G. Romualdez"
longTitle = "ADDRESS OF SPEAKER FERDINAND MARTIN G. ROMUALDEZ: At the outset, Speaker Romualdez expressed his\r\npleasure in welcoming everyone united and ready to\r\nserve the nation with renewed purpose and unbreakable\r\nresolve. He then said that pursuant to Proclamation\r\nNo. 728 issued by President Ferdinand Romualdez\r\nMarcos Jr. declaring November 4, 2024 as a “Day of\r\nNational Mourning,” the entire nation came together\r\nto honor the victims of Severe Tropical Storm (STS)\r\nKristine. He called on his colleagues to find strength in\r\ntheir unity and offer comfort and support to those who\r\nhave lost so much during the calamity and commended the Members who prioritized relief work during the\r\nbreak with dedication and selfless commitment to\r\nserving the nation."
