title = "Message Of Speaker Romualdez ( F. M.)"
longTitle = "MESSAGE OF SPEAKER ROMUALDEZ (F.M.) \r\nSpeaker Romualdez commended the Members for their commitment and untiring efforts that led to the approval of 23 of the 31 vital measures identified by the LEDAC as priority measures that would further stimulate economic activities, create job opportunities, reduce poverty, and provide better health care and services to the Filipino people.\r\nIn acknowledging the significance of e-governance in the efficient delivery of public goods and services, Speaker Romualdez stated that the House, in partnership with the Senate recently launched the electronic Congress portal or “E-Congress”.\r\nHe also mentioned the action taken by the Committee on Ethics and Privileges against Rep. Arnolfo “Arnie” A. Teves Jr., which he said was an equally pressing matter that warranted the House´s urgent and sound response.\r\n"
