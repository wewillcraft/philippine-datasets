title = "Aims To Establish The Systems And Engagement Needed To Detect And Control Potential Disease Outbreaks Like The On-going Surge In Novel Coronavirus (covid-19), By Developing A National Sop/equivalent That Describes The Coordination And Communication Among The Multiple Agencies In The Implementation Of The International Health Regulation (ihr} And Strengthen The Strategic Health Emergency Risk Assessments Using Multiple Sources Of Information, With Focus On Health Risk, Health Impacts And The Vulnerability Of Health System.\r\nIntends To Address The Fact That Only Few Countries Have The Capacities Required Under The Ihr); That Great Majority Of National Health Systems Would Be Unable To Handle A Large Influx Of Patients Infected With A Respiratory Pathogen Capable Of Easy Transmissibility And High Mortality; And That The Joint External Evaluation (jee) Of Ihr Core Capacities Of The Country Reveals That There Are Still Challenges In Achieving Harmonized Approach For Ihr Implementation, Among Others."
