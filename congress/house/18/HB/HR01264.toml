title = "HR01264"
longTitle = "A RESOLUTION DIRECTING THE COMMITTEE ON METRO MANILA DEVELOPMENT TO\r\nINVESTIGATE, IN AID OF LEGISLATION AND OTHER PURPOSES, THE UNDESIRABLE, OBTRUSIVE AND DANGEROUS EFFECTS OF CONSTRUCTIONS ACTIVITIES, PARTICULARLY DIGGINGS AND EXCAVATION WORKS IN NATIONAL ROADS AND/OR HIGHWAYS, IMPLEMENTED BY THE METRO MANILA DEVELOPMENT AUTHORITY, WHICH REMAIN UNFINISHED, INADEQUATELY REPAIRED, IMPROPERLY COVERED AND/OR LACK PROPER WARNING SIGNS; TO COMPEL THE METRO MANILA DEVELOPMENT AUTHORITY TO IMMEDIATELY ADDRESS THESE PROBLEMS, ADMINISTRATIVELY SANCTION RESPONSIBLE OFFICIALS AND, IF NECESSARY, PROMULGATE ADDITIONAL RULES TO AVOID AND CURB THE ABOVE-MENTIONED PRACTICES, WHICH PREJUDICE AND ARE DETRIMENTAL TO THE PUBLIC"
