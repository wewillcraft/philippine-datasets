title = "Intends To Address The Problem Of Specialty Hospitals Being Operationally But Geographically Situated In Metro Manila, Rendering Majority Of Filipinos The Lack Of Access To Health Care; And An Additional Burden For Transportation And Accommodation Expenses For Those Who Can Avail The Services Of These Manila-based Hospitals.\r\nAims To Bridge The Existing Huge Disparity Of Accessibility To Specific Health Care Services To Address The Medical Needs Of Patients With Diseases Of A Particular Organ Or Group Of Organs, And The Health Care Need By A Particular Group, Such As Children, Women, Or The Elderly.\r\nProposes For A Ten (10) Year Specialty Health Care Units Development Plan That Will Identify The Establishment Of Shcus Attached To Existing Doh-regional Hospitals."
