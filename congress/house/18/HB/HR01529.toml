longTitle = "A RESOLUTION DIRECTING  THE   COMMITTEE   ON   PUBLIC   WORKS   AND   HIGHWAYS   TO INVESTIGATE   IN   AID   OF   LEGISLATION   AND   OTHER   PURPOSES,   THE UNDESIRABLE,   OBJECTIONABLE,   AND   NEFARIOUS  PRACTICES   OF CONTRACTORS   OF   GOVERNMENT   PROJECTS   IMPLEMENTED   BY   THE DEPARTMENT   OF   PUBLIC   WORKS   AND   HIGHWAYS,   WHICH   INCLUDE AMONG   OTHERS,   ABANDONMENT   OF   PROJECTS,   NEGATIVE   SLIPPAGE, USAGE OF SUBSTANDARD CONSTRUCTION MATERIALS, AND PROFFERING UNREASONABLY   LOW   BIDS   (“BID   DIVING´),   BORROWING/RENTING   OF LICENSE   OF   ONE   CONTRACTOR   FROM   ANOTHER   CONTRACTOR,   TO COMPEL  THE   DEPARTMENT   OF   PUBLIC   WORKS   AND   HIGHWAYS   TO IMMEDIATELY   PROMULGATE   ADDITIONAL   PRE-QUALIFICATION REQUIREMENTS TO AVOID,  ARREST, AND CURB THE ABOVE-MENTIONED IMPROPRIETIES AND MALPRACTICES TO THE PREJUDICE, DISADVANTAGE, AND DETRIMENT OF GOVERNMENT PROJECTS"
