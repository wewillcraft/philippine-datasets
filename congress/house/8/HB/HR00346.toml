title = "HR00346"
longTitle = "RESOLUTION TO DIRECT THE COMMITTEE ON WAYS AND MEANS TO RESTUDY, RE-EXAMINE AND REVIEW OUR EXISTINGLAWS, RULES AND REGULATIONS RELATIVE TO THE IMPORTATION OF MOTOR VEHICLES, GIVING SPECIAL ATTENTIONTO THE LAWS THAT REGULATE THE IMPORTATION OF LUXURYCARS, TO INQUIRE INTO THE ACTIONS TAKEN BY THE BUREAU OF CUSTOMS WITH RESPECT TO THE INPOUNDING OF THE SO-CALLED LUXURY CARS AND THE UNILATERAL ACTOF SAID OFFICE TO ALLOW THE USE OF THE SAME BY SOME HIGH RANKING GOVERNMENT OFFICIALS THROUGH THE ISSUANCE OF \"MEMORANDUM RECEIPTS\", AND, IN AID OF LEGISLATION, TO SUBMIT ITS FINDING AND RECOMMENDATIONS SO THAT PROPER REMEDIAL LEGISLATION AND OTHER MEASURES CAN BE ADOPTED"
