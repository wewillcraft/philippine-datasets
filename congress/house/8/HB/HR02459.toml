title = "HR02459"
longTitle = "RESOLUTION URGING THE COMMITTEE ON FOREIGN AFFAIRSJOINTLY WITH THE COMMITTEE ON NATIONAL DEFENSE TO CONDUCT A PUBLIC HEARING IN AID OF LEGISLATION REGARDING THE POSSIBILITY OF EXPLORING JOINT COOPERATIVE AGREEMENTS IN DEVELOPING THE HOTLY DISPUTED SPRATLY ISLANDS.  THE RESOLUTION URGES THE COMMITTEE WITH THE DEPARTMENT OF FOREIGN AFFAIRS TO EXPLORE AREAS OF COOPERATION IN WORKING OUT THE ECONOMI C POTENTIALS FOR THE AREA. SAME RESOLUTION ALSO DIRECTS THE COMMITTEES CONCERNED TO LOOK INTO THE POLITICAL AND SECURITY IMPLICATIONS WITH RESPECT TO ADOPTING JOINT AGREEMENTS OF COOPERATION AMONGST ASEAN MEMBER COUNTRIES CLAIMING JURISDICTION IN THE SPRATLY ISLANDS GROUPS"
