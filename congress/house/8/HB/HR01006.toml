longTitle = "RESOLUTION DIRECTING THE CENTRAL BANK OF THE PHILIPPINES TO SET ASIDE US $35 MILLION FROM THE FOREIGN EXCHANGE RESERVES OF THE COUNTRY FOR THE ONE-TIME IMPORTATION OF FIVE-TO-SIX YEAR OLD CARS, BUSES, AND TRUCKS FOR THE BENEFIT OF THE TAXICAB INDUSTRY, PUBLIC UTILITY-BUS INDUSTRY, AND THE AGRICULTURAL SECTOR, IN WHICH, THE GUIDELINE CONCERNING THEREPAYMENT SCHEME, EQUITABLE AND REASONABLE DISTRIBUTION, AND PROCEDURES IN AVAILMENT OF THE EARMARKED AMOUNT SHALL BE PREPARED BY THE DEPARTMENT OF TRADE AND INDUSTRY (DTI) IN COORDINATION WITH THE BOARD OF INVESTMENT (BOI) WITHIN (90) NINETY DAYS UPON APPROVAL OF THIS RESOLUTION, AND TO RESOLVE FURTHER THAT THE DTI/BOI SHALL EXPLORE COUNTER-TRADEAR RANGEMENT TO PAY FOR IMPORTATION"
