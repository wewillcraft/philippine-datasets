longTitle = "RESOLUTION TO DIRECT THE COMMITTEE ON FOREIGN AFFAIRS AND COMMITTEE ON REVISION OF LAWS TO CONDUCT AN INVESTIGATION IN AID OF LEGISLATION OF THE CHARGE THAT THE SECRETARY OF FOREIGN AFFAIRS, THE HONORABLE RAUL MANGLAPUS, IS USING THE FACILITIES OF HIS OFFICE TO REQUIRE EMBASSY AND CONSULATE OFFICIALS TO UNDERTAKE PROMOTIONAL CAMPAIGN FOR A FILIPINO CAR TO BE BUILT IN THE PHILIPPINES BY THE FILIPINO CAR FOUNDATION OF WHICH THE HONORABLE SECRETARYIS THE ALLEGED FOUNDER, TO DETERMINE THE SCOPE OFWHETHER SAID ACTS CONSTITUTE CORRUPT PRACTICES AND UNETHICAL CONDUCT OF GOVERNMENT OFFICIALS AND TORECOMMEND THE NECESSARY LEGISLATION TO ERADICATE ABUSE OF GOVERNMENT OFFICE TO PROMOTE PRIVATE INTEREST WHILE ALLEGEDLY ACTING OR REPRESENTING THE COUNTRY IN FOREIGN RELATIONS"
