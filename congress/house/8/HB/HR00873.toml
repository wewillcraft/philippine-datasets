title = "HR00873"
longTitle = "RESOLUTION DIRECTING THE COMMITTEE ON BANKS TO CONDUCT AN INQUIRY IN AID OF LEGISLATION INTO THE SO-CALLED \"NEW DISBURSEMENT SCHEME (NDS)\" WHEREBY PUBLIC FUNDS ARE DEPOSITED WITH PRIVATE COMMERCIAL BANKS (METROBANK, FAR EAST BANK, UCPB, PCIB AND BANK OF P.I.), RESULTING TO UNDUE DELAYS IN THE RELEASES OF SUCH FUNDS, PARTICULARLY, FOR PAYMENT AMONGOTHERS OF SUCH NEEDED SALARIES FOR PUBLIC SCHOOL TEACHERS, FOR MILITARY PERSONNEL, AND FOR URGENT PUBLIC WORKS PROJECTS, AS WELL AS POSSIBLE VIOLATIONOF THE ANTI-GRAFT LAW SINCE ALLEGEDLY THE NDS \"PUTS THE GOVERNMENT IN A FINANCIAL DISADVANTAGE LIKE FAVORING PRIVATE INSTITUTIONS TO MAKE MONEY AT THE EXPENSE OF THE GOVERNMENT\" AND TO RECOMMEND SUCH MEASURES AS MAY BE NECESSARY UNDER THE CIRCUMSTANCES"
