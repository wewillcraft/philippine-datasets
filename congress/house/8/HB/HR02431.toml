longTitle = "RESOLUTION DIRECTING THE SUGAR REGULATORY ADMINISTRATION (SRA) TO UNDERTAKE A STUDY ON THE VOLUME OF SUGAR REQUIRED BY LOCAL MANUFACTURERS/E XPORTERS OF SUGAR-BASED COMMODITIES, AND TO DIRECTLY SUPPLY THEM THESE SUGAR REQUIREMENTS AT A PRICE EQUIVALENT TO THE LANDED COST OF IMPORTED SUGAR AND/OR ISSUE THEM THE LICENSE TO IMPORT SPECIFIC QUANTITIES OF THE COMMODITY WHEN A SHORTAGE OF PHILIPPINE SUGAR EXISTS; AND FURTHER DIRECTING THE SRA TO UNDERTAKE A STUDY ON THE FEASIBILITY OF GRANTING TAX EXEMPTIONS TO LOCAL MANUFACTURERS/E XPORTERS OF SUGAR-BASED PRODUCTS, IN LIEU OF ALLOWING THEM TO IMPORT SUGAR, TO EFFECTIVELY LOWER THEIR PRODUCTION"
