longTitle = "RESOLUTION URGING THE EXECUTIVE DEPARTMENT, THROUGH THE OFFICE OF THE PRESIDENT, AND THE COMMITTEE ON WAYS AND MEANS OF THE HOUSE OF REPRESENTATIVES AND SENATE, TO CONSIDER THE REMOVAL OF EXCISE TAXES ON SELECTED OIL PRODUCTS, NAMELY KEROSENE AND LIQUEFIED PETROLEUM GAS, IN ORDER TO LIGHTEN THE EXPECTED PRICE INCREASE BURDEN ON THE FILIPINO CONSUMERS DUE TO THE CURRENT MIDDLE EAST CRISIS; AND TO URGENTLY INCLUDE SAID CONSIDERATION IN THE FORMULATION OF LEGISLATIVE MEASURES CONVERTING AD VALOREMTAXES OF OIL PRODUCTS TO SPECIFIC TAXES"
