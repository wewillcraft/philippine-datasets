title = "HR00925"
longTitle = "RESOLUTION REQUESTING THE PRESIDENT OF THE PHILIPPINES AND THE SECRETARY OF FOREIGN AFFAIRS TO FIX THE AMOUNT OF US $ 1.2 BILLION PER ANNUM PAYABLE IN CASH, U.S. P.L. 480 COMMODITIES, CAPITAL GOODS, FOREIGN MILITARY CREDITS, TRADE WAIVERS AND BENEFITS, AND U.S. TREASURY BONDS, OR COMBINATIONS THEREOF, ETC. THAT MAY BE UTILIZED FOR PHILIPPINE EXTERNAL DEBT REDUCTION AND OTHER FORMS OF DEBT RELIEF,AND FOR OTHER PURPOSES, AS COMPENSATION PACKAGE FOR THE CONTINUED PRESENCE AND OPERATION OF UNITED STATES MILITARY FACILITIES IN THE PHILIPPINES, WITH APPROPRIATE CONTRIBUTION FROM JAPAN AND MIDDLE EASTERN STATES IN THE PERSIAN GULF SUCH AS SAUDI ARABIA, KUWAIT, UNITED ARAB EMIRATES, ETC. UNDER THEINTERNATIONA LLY-SUPPORTED 'MINI-MARSHALL PLAN' OR'PHILIPPINE AID PLAN', SUBJECT TO THE WILL OF THEFILIPINO PEOPLE ON THE RETENTION OR REMOVAL OF SUCH MILITARY FACILITIES, AS EXPRESSED IN A NATIONALREFEREN DUM, FOLLOWING SIGNING OF AN APPROPRIATE TREATY AND ITS RATIFICATION BY THE SENATE OF THE PHILI"
