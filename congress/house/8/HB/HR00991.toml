longTitle = "RESOLUTION DIRECTING THE HOUSE COMMITTEE ON HUMANRIGHTS TO CONDUCT, IN AID OF LEGISLATION, AN IMPARTIAL INVESTIGATION ON THE INTRIGUING AND SUSPICIOUS CIRCUMSTANCES ON THE FATAL SHOOTING OR ALLEGED COLD BLOODED MURDER WHILE TRYING TO ESCAPE OF DETAINED AIR FORCE EX-LIEUTENANT COLONEL FRANCISCO BAULA INSIDE THE PHILIPPINE CONSTABULARY STOCKADE AT CAMP CRAME, QUEZON CITY, ON OCTOBER 15, 1988, TO RECOMMEND MEASURES ON HOW TO PROTECT AND ENHANCE HUMAN RIGHTS OF SUSPECTS AND DETAINED PERSONS WHILE IN MILITARY CUSTODY ESPECIALLY THOSE CASES WHEREINSUSPECTS AND DETAINEES ALLEGE THAT THEIR CAPTORS POCKETED PART OF THE MONEY, CASH OR PROPERTY OF SUCH DETAINED PERSONS"
