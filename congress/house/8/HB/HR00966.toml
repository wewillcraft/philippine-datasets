longTitle = "RESOLUTION DIRECTING THE COMMITTEE ON SCIENCE ANDTECHNOLOGY TO CONDUCT AN INQUIRY IN AID OF LEGISLATION, ON THE STATUS OF SCIENCE AND TECHNOLOGY IN THE COUNTRY, WHICH REPORTEDLY RANKED SECOND ONLY TO JAPAN BUT DETERIORATED TO SECOND TO THE LAST IN ASIA IN A SPAN OF ONLY 30 YEARS, AND THE ALLEGED FORMULATION AND IMPLEMENTATION OF UNSOUND SCIENCE POLICIES IN AND MISMANAGEMENT OF THE DEPARTMENT OF SCIENCE AND TECHNOLOGY RESULTING TO ACUTE AND EXTREME SHORTAGE OF HIGHLY TRAINED RESEARCH AND DEVELOPMENT SCIENTISTS AND THE SINKING OF THE COUNTRY'S INTERNATIONAL POSITION IN SCIENCE AND TECHNOLOGY AND TO RECOMMEND INCREASING BUDGETARY APPROPRIATIONS FOR RESEARCH AND DEVELOPMENT AND SUCH OTHER MEASURES AS MAY BE NECESSARY TO ARREST THE FURTHER DETERIORATION OF S AND T AND THE ALARMING BRAIN DRAININ THE COUNTRY"
