longTitle = "RESOLUTION CONVEYING TO THE AMERICAN PEOPLE, TO HIS EXCELLENCY, THE PRESIDENT OF THE UNITED STATES OF AMERICA, TO THE U.S. HOUSE OF REPRESENTATIVES AND THE U.S. SENATE, THE STRONG SENTIMENT OF THIS BODY AGAINST THE WELL-ORGANIZED BUT HIGHLY DESCRIMINATORY AND OBVIOUSLY PROTECTIONIST MOVES OF AMERICAN NON-COCONUT EDIBLE OIL PRODUCERS AGAINST THE COCONUT OIL WHICH, IF SUCCESSFUL, WILL DEPRESS THE PRICE OF COCONUT OIL, ONE OF THE COUNTRY'S DOLLAR EARNERS, THEREBY BLUNTING THE PHILIPPINES ECONOMICRECOVERY PROGRAM AND CAUSING TREMENDOUS HARDSHIP AMONG OUR PEOPLE DEPENDENT ON THE COCONUT INDUSTRY obviously protectionist moves of american non-coconut edible oil producers against the coconut oil which, if successful, will depress the price of coconut oil, one of the country's dollar earners, thereby blunting the philippines economic recovery program and causing tremendous hardship among our people dependent on the coconut industry"
