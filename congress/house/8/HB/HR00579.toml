title = "HR00579"
longTitle = "RESOLUTION DIRECTING THE COMMITTEE ON TRANSPORTATION TO CONDUCT AN INQUIRY IN AID OF LEGISLATION INTO THE OPERATION OF SHIPPING COMPANIES IN THE FACEOF CONTINUING COMPLAINTS AGAINST THEIR WANTON VIOLATION OF THEIR FRANCHISES, MARITIME LAWS, RULES AND REGULATIONS THAT RESULTED INTO THE WORST MARITIME DISASTER IN PEACE-TIME WORLD SHIPPING WHICH BROUGHT ABOUT THE DEATH OF THREE THOUSAND MORE OR LESSINNOCENT PASSENGERS IN THE DONA PAZ-VECTOR COLLISION; WITH THE END IN VIEW OF ENCOURAGING OTHER GROUPS TO COMPETE IN A GIVEN PASSENGER SHIPPING REGIONAL ROUTES IN THE FORM OF TAX CREDIT GRANTS, AND IN CASE THERE IS NO COMPETITION FOR THE GOVERNMENT TO COME IN BY PUTTING ITS OWN SERVICE FLEETS; AND TO MANDATE THE MARITIME AGENCIES TO STRICTLY ENFORCE MARITIME LAWS, RULES AND REGULATIONS, AND THE ANTI-MONOPOLY LAW; AND ALSO TO RECOMMEND SOME MEASURES AS MAY BE NECESSARY TO IMPROVE THEIR SERVICES"
