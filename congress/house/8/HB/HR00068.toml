longTitle = "RESOLUTION URGING THE COMMITTEE ON LOCAL GOVERNMENT TO CONDUCT AN INQUIRY IN AID OF LEGISLATION, INTO THE ADVISABILITY OF HOLDING THE LOCAL ELECTIONSON NOVEMBER 9, 1987 IN THE FACE OF (A) THE ECONOMIC DIFFICULTIES THE COUNTRY IS FACING, (B) THE OBTAINING PEACE AND ORDER SITUATION, (C) THE TIME CONSTRAINTS ADMITTEDLY BESETTING THE COMELEC, (D) THECURRENT CONCERNS, PARTICULARLY THE LAND REFORM ISSUE POLARIZING THE NATION, (E) THE NEED TO EFFECT SUBSTANTIAL ELECTORAL REFORMS BEFORE ANOTHER POLITICAL EXERCISE IS HELD; (F) THE IMPENDING INCREASE IN PRICE OF COMMODITIES; (G) THE CONSEQUENT INFLATIONARY EFFECTS OF ELECTIONS; ETC., WITH THE VIEW TODETERMINING THE MORE OPPORTUNE TIME IN HOLDING SAID ELECTIONS"
