title = "HR00063"
longTitle = "RESOLUTION DIRECTING THE COMMITTEE ON PUBLIC WORKS TO CONDUCT AN INQUIRY INTO THE WORSENING CONDITION OF THE MAHARLIKA HIGHWAY, REGULARLY USED BY COMMUTERS FROM THE PROVINCE OF QUEZON, CAMARINES NORTE, CAMARINES SUR, ALBAY, SORSOGON, SAMAR AND LEYTEWITH THE VIEW TO A) DETERMINE THE CAUSE OR CAUSESOF SAID BREAKDOWN AND DETERIORATION OF AFFECTED SEGMENTS OF THAT HIGHWAY, B) PINPOINT RESPONSIBILITY THEREFOR; C) RECOMMEND SUCH REMEDIAL, CORRECTIVEOR APPROPRIATE MEASURES AS MAY BE NECESSARY TO ASSURE THAT REPAIRS AND/OR RECONSTRUCTION OF THE MAHARLIKA ROAD NETWORK BE UNDERTAKEN IN ACCORDANCE WITH APPROPRIATE AND ACCEPTED STANDARDS, WITH THE MINIMUM OF WASTE, NEGLECT, INCOMPETENCE AND GRAFT; AND, IN THE MEANWHILE, D) RECOMMEND PROMPT REPAIRS AND/OR RECONSTRUCTION TO PREVENT CONTINUING INCONVENIENCE, DELAYS, WEAR AND TEAR AND DAMAGES TO VEHICLES AND, MORE IMPORTANTLY, LOSS OF LIVES OF COMMUTERS CONSEQUENT UPON FREQUENT VEHICULAR ACCIDENTS OCCURRING IN SAID HIGHWAYS ON ACCOUNT OF ITS SUB-STAN"
