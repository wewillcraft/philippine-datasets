longTitle = "RESOLUSYON NA HUMIHILING SA KANYANG KAMAHALAN CORAZON C. AQUINO, PRESIDENTE NG REPUBLIKA NG PILIPINAS, NA IPATIGIL NG TATLONG (3) TAON MAN LAMANG ANGPAGPAPATAKBO NG TUBIG PARA SA KURYENTE O HYDRO-ELECTRIC OPERATION NG PANTABANGAN DAM PARA MAKAIPON AT MAKAPUNO ITO NG TUBIG SA SUKDULANG KAPASIDAD NITO AT NANG SA GAYON MAIBALIK ANG PANGUNAHING GAWAIN NITO NA PAGPAPATUBIG PARA SA PANANIM-DAYATAN AT PAG-ULAN (RESOLUTION REQUESTING HER EXCELLENCY CORAZON C. AQUINO, PRESIDENT OF THE PHILIPPINES, TO SUSPEND THE HYDRO-ELECTRIC OPERATION OF THE PANTABANGAN DAM FOR A PERIOD OF AT LEAST (3) THREE YEARS SO AS TO ENABLE THE DAM TO RESTORE WATER IN ITS OPTIMUM CAPACITY AND THUS RESTORE ITS PRIMARY FUNCTION OF IRRIGATION FOR THE MAIN CROP AS WELL AS SECOND CROP SEASONS)"
