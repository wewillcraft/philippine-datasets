longTitle = "A RESOLUTION MANDATING IN AID OF LEGISLATION, THE COMMITTEE ON AGRICULTURE OF THE HOUSE OF REPRESENTATIVES TO REVIEW AND CONDUCT AN IN-DEPTH ANALYSIS OF COCONUT FLOUR AS A LOCALLY AVAILABLE AND HEALTHIER ALTERNATIVE TO WHEAT-BASED FLOUR AND OTHER IMPORTED FLOURS AND URGING THE PHILIPPINE COCONUT AUTHORITY (PCA) UNDER THE DEPARTMENT OF AGRICULTURE, THE FOOD AND NUTRITION INSTITUTE OF THE PHILIPPINES (FNRI) UNDER THE DEPARTMENT OF SCIENCE AND TECHNOLOGY AND THE BUREAU OF FOOD AND DRUG (BFAD) UNDER THE DEPARTMENT OF HEALTH TO JOINTLY PROPOSE AND RECOMMEND RESEARCH PROGRAMS, PRODUCTION AND MARKETING PROJECTS, PROMOTIONAL AND EDUCATIONAL CAMPAIGNS THAT WILL BOOST THE COMMERCIAL PRODUCTION, DEMAND AND CONSUMPTION OF COCONUT FLOUR TO MEET DOMESTIC NEEDS AND INTERNATIONAL REQUIREMENTS AND FOR THE COMMITTEE ON AGRICULTURE TO PROPOSE LEGISLATIVE ENACTMENTS IN SUPPORT OF COCONUT FLOUR AS A NEW BY-PRODUCT OF THE COCONUT INDUSTRY"
