title = "HR00503"
longTitle = "A RESOLUTION DIRECTING THE COMMITTEE ON OVERSIGHT TO INQUIRE WHETHER THE BANGKO SENTRAL NG PILIPINAS (BSP) HAS VIOLATED AND CONTINUES TO VIOLATE THE EXPRESS PROVISIONS OF THE NEW CENTRAL BANK ACT (R.A. 7653) THAT PRESCRIBE THAT IN THE CALCULATION OF ANNUAL PROFITS AS BASIS FOR DETERMINING THE DIVIDENDS PAYABLE TO THE NATIONAL GOVERNMENT (NG), ONLY RESERVES FOR BAD AND DOUBTFUL ACCOUNTS ARE LEGALLY ALLOWABLE RESERVES THAT ARE PERMITTED AS DEDUCTIONS IN THE CALCULATION OF NET PROFITS AFTER OPERATING EXPENSES FOR THE PURPOSE OF CARRYING OUT THE MANDATED PERCENTAGE OF NET PROFITS THAT SHALL CONSTITUTE DIVIDENDS PAYABLE TO THE NATIONAL GOVERNMENT AND AFTER DUE HEARING AND EVALUATION OF THE ISSUES INVOLVED, THE COMMITTEE ON OVERSIGHT SHALL RECOMMEND, TO THE APPROPRIATE AUTHORITIES, IF WARRANTED, REMEDIAL MEASURES TO INSURE STRICT COMPLIANCE WITH THE SPECIFIC PROVISIONS OF LAW GOVERNING THE PROPER CALCULATION OF NET PROFITS THAT ARE DETERMINATIVE OF THE PERCENTAGE OF DIVIDENDS PAYABLE BY THE BANGKO SENTRAL NG PILIPINAS (BSP) TO THE NATIONAL GOVERNMENT (NG)"
