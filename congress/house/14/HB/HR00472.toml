title = "HR00472"
longTitle = "RESOLUTION DIRECTING THE COMMITTEE ON BANKS AND FINANCIAL INTERMEDIARIES (WHICH UNDER THE RULES OF THE HOUSE OF REPRESENTATIVES HAS JURISDICTION IN ALL MATTERS DIRECTLY AND PRINCIPALLY RELATING NOT ONLY TO BANKING, QUASI-BANKING AND NON-BANK FINANCIAL INSTITUTIONS, BUT ALSO TO SECURITIES AND SECURITIES EXCHANGES) TO INVESTIGATE, IN AID OF LEGISLATION, WHETHER OR NOT THE ESTABLISHMENT AND OPERATION OF A FIXED INCOME EXCHANGE AND THE OVER-THE-COUNTER (OTC) MARKET SPECIALLY FOR GOVERNMENT SECURITIES WHICH IS A FACILITY OUTSIDE THE EXCHANGES ARE IN ACCORDANCE WITH THE LETTER AND INTENT OF REPUBLIC ACT 8799 (SECURITIES REGULATION CODE) AND TO RECOMMEND, AFTER DUE HEARING, REMEDIAL MEASURES AND/OR TO INTRODUCE CLARIFICATORY LEGISLATIVE ENACTMENTS TO RECTIFY ERRORS AND LAPSES, IF ANY, ARE NEEDED AND/OR TO PASS SUPPLEMENTARY LEGISLATION TO MAKE MORE EFFICIENT AND EFFECTIVE THE GOVERNING LAWS THAT MANDATE THE ESTABLISHMENT OF A SOCIALLY CONSCIOUS FREE MARKET THAT REGULATES ITSELF, DEVOID OF DEVICES AND PRACTICES WHICH CREATE DISTORTIONS IN A FREE MARKET"
