title = "HR00506"
longTitle = "A RESOLUTION MANDATING, IN AID OF LEGISLATION THE BUREAU OF PLANT INDUSTRY (BPI); THE BUREAU OF POST HARVEST RESEARCH AND EXTENSION (BPHRE); THE BUREAU OF AGRICULTURAL AND FISHERIES PRODUCT STANDARDS (BAFPS) OF THE DEPARTMENT OF AGRICULTURE OF THE PHILIPPINES AND THE FOOD AND NUTRITION RESEARCH INSTITUTE (FNRI) OF THE DEPARTMENT OF SCIENCE AND TECHNOLOGY OF THE PHILIPPINES, TO BE CONSTITUTED AS AN INTER-AGENCY COMMITTEE, TO REVIEW, STUDY, ANALYZE AND RECOMMEND THE APPROPRIATE AND NECESSARY GUIDELINES OR STANDARDS TO BE ADOPTED IN THE PLANTING AND PROCESSING OF MALUNGGAY (MORINGA OLEIFERA) PRODUCTS TO ENSURE THE HIGH LEVEL OF QUALITY AND SAFETY OF MALUNGGAY PRODUCTS THAT ARE BEING SOLD OR TO BE SOLD IN THE DOMESTIC AND INTERNATIONAL MARKETS; AND TO DETERMINE SPECIFICALLY WHAT TYPES OF EXPERIMENTATION, STUDIES AND RESEARCHES ARE NEEDED TO EFFECTIVELY SUPPORT THE FARMERS AND MANUFACTURERS IN THE MALUNGGAY INDUSTRY"
