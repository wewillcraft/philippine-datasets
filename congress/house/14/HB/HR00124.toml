title = "HR00124"
longTitle = "RESOLUTION EXPRESSING THE SENSE OF THE HOUSE OF REPRESENTATIVES THAT THE PHILIPPINE GOVERNMENT URGES THE GOVERNMENT OF JAPAN TO FORMALLY ACKNOWLEDGE, APOLOGIZE AND ACCEPT ITS RESPONSIBILITY OVER THE SEXUAL SLAVERY OF YOUNG WOMEN COMMONLY KNOWN AS COMFORT WOMEN BY THE JAPANESE IMPERIAL ARMY DURING WORLD WAR II AND PROVIDE COMPENSATION TO THE VICTIMS IN THE LIGHT OF THE ADOPTION BY THE U.S. HOUSE OF REPRESENTATIVES OF HOUSE RESOLUTION 121 WHICH STATES THAT JAPAN SHOULD FORMALLY ACKNOWLEDGE, APOLOGIZE AND ACCEPT HISTORICAL RESPONSIBILITY IN CLEAR AND UNEQUIVOCAL MANNERS OVER ITS ARMED FORCE'S COERCION OF YOUNG WOMEN INTO SEXUAL SLAVERY DURING ITS COLONIAL AND WARTIME OCCUPATION OF ASIA, AND IN THE LIGHT OF THE LEGISLATIVE INITIATIVES IN THE HOUSE OF COUNCILORS OF JAPAN SEEKING APOLOGY, COMPENSATION AND IMMEDIATE RESOLUTION OF ISSUES CONCERNING COMFORT WOMEN"
