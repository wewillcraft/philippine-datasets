title = "HR00720"
longTitle = "RESOLUTION  CALLING ON THE COMMITTEE ON BANKS AND FINANCIAL INTERMEDIARIES TO INQUIRE AND INVESTIGATE IN AID OF LEGISLATION, REPORTS RECEIVED FROM CERTAIN SECTORS THAT SOME SPECIAL PURPOSE VEHICLES (SPVs) WHO HAVE AVAILED OF TAX EXEMPTIONS AND PRIVILEGES UNDER THE PROVISIONS OF THE ACT HAVE ALLEGEDLY ENTERED IN TRANSFERS NOT IN THE CONCEPT OF A TRUE SALE OR AN ARM'S LENGTH TRANSACTIONS AS CONTEMPLATED, AND IN THE PROCESS OF ALLOWING FINANCIAL INSTITUTIONS TO SANITIZE THEIR BALANCE SHEETS THROUGH FICTITIOUS TRANSFERS OF NON-PERFORMING ASSETS (NPAs), THUS DEPRIVING THE GOVERNMENT OF TAXES WHICH WOULD HAVE BEEN COLLECTED, AND TO RECOMMEND, AFTER DUE HEARING, REMEDIAL MEASURES AND/OR TO INTRODUCE CLARIFICATORY LEGISLATIVE ENACTMENTS TO RECTIFY ERRORS AND LAPSES, IF ANY, AND TO PASS AMENDATORY LEGISLATION, IF NECESSARY, TO MAKE MORE EFFICIENT AND EFFECTIVE THE GOVERNING LAWS THAT MANDATE THE ESTABLISHMENT OF SPVs"
