title = "HR01354"
longTitle = "RESOLUTION DIRECTING THE COMMITTEE ON HIGHER AND TECHNICAL  EDUCATION AND TO ANY OTHER APPROPRIATE HOUSE COMMITTEE TO CONDUCT A JOINT FORMAL AND THOROUGH INVESTIGATION, IN AID OF LEGISLATION, ON THE RECURRENT STATISTICAL INACCURACIES PUBLISHED IN NATIONAL BROADSHEETS AND TABLOIDS AND POSTED IN THE WEBSITE RELATIVE TO THE RESULTS OF LICENSURE EXAMINATIONS CONDUCTED BY THE PROFESSIONAL REGULATION COMMISSION AND THE VARIOUS BOARDS TO THE DETRIMENT OF MANY HIGHER EDUCATION INSTITUTIONS IN ORDER TO DETERMINE THE FACTS AND CIRCUMSTANCES LEADING TO SUCH IRRESPONSIBLE PUBLICATIONS AND POSTINGS, TO ASCERTAIN THE RESPONSIBILITY OF THE PERSON OR GROUP OF PERSONS BEHIND THE SAME, TO INSTALL MEASURES TO AVOID PUBLICATION AND POSTING OF SUCH STATISTICAL INACCURACIES, AND TO ESTABLISH STATISTICAL NORMS AND STANDARDS JUST AND FAIR TO HIGHER EDUCATION INSTITUTIONS"
