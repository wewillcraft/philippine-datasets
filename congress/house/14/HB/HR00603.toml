title = "HR00603"
longTitle = "A RESOLUTION DIRECTING THE COMMITTEE ON BANKS AND FINANCIAL INTERMEDIARIES TO INQUIRE INTO AND INVESTIGATE, IN AID OF LEGISLATION WHY THE BANGKO SENTRAL NG PILIPINAS (BSP) HAS CONTINUOUSLY BEEN PLACING MORE AND MORE RURAL BANKS UNDER PROMPT CORRECTIVE ACTION (PCA), UNDER REHABILITATION, UNDER RECEIVERSHIP, UNDER LIQUIDATION AND CLOSURE, WHICH AT THE SPEED THE BSP IS DOING THIS MAY RESULT IN THE MARGINALIZATION OF RURAL BANKS IN OUR BANKING SYSTEM, CONTRARY TO THE PROVISIONS OF REPUBLIC ACT NO. 7353 OTHERWISE KNOWN AS THE RURAL BANKS ACT OF 1992, WHICH ENCOURAGES THE ESTABLISHMENT OF RURAL BANKS IN THE COUNTRY TO MAKE AVAILABLE CREDIT IN THE RURAL AREAS WHICH THE LARGE COMMERCIAL/UNIVERSAL BANKS ARE HARDLY ABLE TO REACH AND IF THE SITUATION CONTINUES WHEREIN RURAL BANKS ARE STYMIED IN THIS OPERATIONS AND UNLESS REMEDIAL OR CORRECTIVE MEASURES BE ADOPTED, THE GROWTH OF RURAL BANKS IN THE COUNTRY WILL BE HAMPERED TO THE DETRIMENT OF COUNTRYSIDE DEVELOPMENT"
