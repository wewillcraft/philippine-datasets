title = "HR00041"
longTitle = "A RESOLUTION DIRECTING THE COMMITTEE ON HEALTH AND THE COMMITTEE ON TRADE AND INDUSTRY OF THE HOUSE OF REPRESENTATIVES TO INQUIRE INTO AND TO INVESTIGATE, IN AID OF LEGISLATION, THE ALLEGED ILL EFFECTS AND HAZARDS TO HEALTH OF PHTHALATE ESTERS AND ARTIFICIAL OR SYNTHETIC MUSKS, WHICH ARE ALLEGEDLY TOXIC MATERIALS CONTAINED IN VARIOUS POPULAR PERFUMES WHICH ARE COMMERCIALLY SOLD AND TRADED IN THE PHILIPPINE MARKET TODAY, AND TO REQUIRE IN CONNECTION WITH SUCH INQUIRY AND INVESTIGATION, THE BUREAU OF FOOD AND DRUGS (BFAD), AN ATTACHED AGENCY OF THE DEPARTMENT OF HEALTH, AND THE BUREAU OF TRADE REGULATIONS AND CONSUMER PROTECTION, AN ATTACHED AGENCY OF THE DEPARTMENT OF TRADE AND INDUSTRY, TO SUBMIT THEIR RESPECTIVE EVALUATIONS AND RECOMMENDATIONS ON WHETHER OR NOT PRODUCTS CONTAINING SUCH ALLEGED TOXIC CHEMICALS SHOULD BE ALLOWED TO BE SOLD AND MARKETED TO CONSUMERS IN THE PHILIPPINES OR ALTOGETHER BANNED FROM THE LOCAL MARKET, SUBJECT TO SUCH PENALTIES AND SANCTIONS THAT MAY BE PROVIDED BY LAW"
