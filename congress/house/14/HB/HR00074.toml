title = "HR00074"
longTitle = "A RESOLUTION DIRECTING THE DEPARTMENT OF ENVIRONMENT AND NATURAL RESOURCES TO SUBMIT, WITHIN FORTY-FIVE (45) DAYS OF RECEIPT OF THIS RESOLUTION, TO THE COMMITTEE ON NATURAL RESOURCES OF THE HOUSE OF REPRESENTATIVES, IN AID OF REMEDIAL LEGISLATION, ITS DETAILED INVENTORY, EVALUATION AND RECOMMENDATIONS ON EXISTING MINING PERMITS, CONTRACTS AND AGREEMENTS, WHEREIN THE PERMITEES, GRANTEES AND PARTIES TO THE CONTRACTS THERETO ARE NON-COMPLIANT WITH THE STIPULATED TERMS AND CONDITIONS, NON-PERFORMING WITH RESPECT TO WORK OBLIGATIONS OR VIOLATIVE OF THE PROVISIONS OF APPLICABLE LAW, SUCH THAT VALID CAUSES MAY EXIST TO REVOKE, CANCEL OR RESCIND EXISTING MINING PERMITS, CONTRACTS AND AGREEMENTS, IN ORDER TO OPEN UP OPPORTUNITIES FOR EXPLORATION AND/OR DEVELOPMENT OF NATURAL MINERAL RESOURCES TO BONAFIDE INVESTORS WITH TECHNICAL AND FINANCIAL CAPABILITY TO PRODUCTIVELY UTILIZE METALLIC AND NON-METALLIC MINERALS, IN ORDER TO PROVIDE MATERIALS FOR INDUSTRIES, CREATE EMPLOYMENT OPPORTUNITIES, GENERATE GOVERNMENT REVENUES AND EXPAND OUR NATION'S EXPORT CAPACITY, IN A SUSTAINABLE AND ENVIRONMENTALLY SOUND POLICY SETTING"
