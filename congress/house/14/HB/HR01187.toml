longTitle = "RESOLUTION DIRECTING THE COMMITTEE ON PUBLIC ORDER AND SECURITY TO CONDUCT AN INVESTIGATION, IN AID OF LEGISLATION, WHY THE OFFICIALS OF THE HOUSE OF REPRESENTATIVES ALLOW THE MILITANT DEMONSTRATORS OR PROTESTERS WHO ARE MEMBERS OF BAYAN MUNA, ANAK PAWIS, GABRIELA AND KABATAAN DESPITE OF HAVING THEIR OWN ELECTED REPRESENTATIVES IN THE LOWER HOUSE OF CONGRESS, TO CAMP-IN AND PICKET AT THE GATES OF THE BATASANG PAMBANSA COMPLEX FOR WHICH SUCH MASS ACTIONS AND ACTIVITIES AFFECT THE INGRESS AND EGRESS OF THE LEGISLATURE, DISRUPT THE FLOW OF TRAFFIC AND POSE A GRAVE AND POSITIVE DANGER TO THE LEGISLATORS AND TO PUBLIC SAFETY AND SECURITY, AND THEREAFTER, TO MAKE THE APPROPRIATE MEASURES TO PREVENT MASS ACTIONS WITHIN THE PREMISES OF THE HOUSE OF REPRESENTATIVES"
