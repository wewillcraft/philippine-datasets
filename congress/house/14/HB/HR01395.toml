title = "HR01395"
longTitle = "A RESOLUTION DIRECTING THE COMMITTE ON BANKS AND FINANCIAL INTERMEDIARIES TO CONDUCT AN INQUIRY, IN AID OF LEGISLATION, ON THE ALLEGED INADEQUACIES AND IMPERFECTIONS OF R.A. 9182 OTHERWISE KNOWN AS THE SPECIAL VEHICLE ACT OF 2002, AND AS AMENDED, R.A. 9343 OF 2005, AND ITS IMPLEMENTING RULES AND REGULATIONS, WHICH INADEQUACIES ARE ALLEGEDLY THE MAIN CAUSE OF NUMEROUS COMPLAINTS BY CITIZENS WHOSE OWNERSHIP RIGHTS TO THEIR PROPERTIES WERE ADVERSELY PREJUDICED, TO DETERMINE POSSIBLE COURSES OF POSITIVE ACTION, AND THE POSSIBLE REMEDIAL MEASURES THAT WILL ADDRESS THESE PROBLEMS, AND THE LEGISLATION, AS IS NECESSARY, TO ENSURE PROPER IMPLEMENTATION OF THESE LAWS, AND FURTHER, TO ENSURE THAT CITIZENS SO AFFECTED ARE GIVEN PROPER DUE PROCESS, SUCH THAT THEIR PROPERTY RIGHTS ARE HANDLED IN A FAIR AND EQUITABLE MANNER"
