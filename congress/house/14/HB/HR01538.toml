title = "HR01538"
longTitle = "RESOLUTION MANDATING IN AID OF LEGISLATION, THE REVIEW AND IN-DEPTH ANALYSIS AND EVALUATION OF THE HUMAN HEALTH RISKS OF CELL PHONE RADIATION REFERRED TO AS THE ELECTRO-MAGNETIC RADIATION (EMR) OR THE ELECTRO-MAGNETIC FREQUENCY (EMF) TO BE  CONDUCTED BY AN INTER-AGENCY TASK FORCE THAT SHOULD BE ORGANIZED BY THE DEPARTMENT PF HEALTH (DOH), THE DEPARTMENT OF SCIENCE AND TECHNOLOGY (DOST), THE DEPARTMENT OF TRANSPORTATION AND COMMUNICATION (DOTC), THROUGH THE NATIONAL TELECOMMUNICATIONS COMMISSION (NTC) AND THE UNIVERSITY OF THE PHILIPPINES SCIENCE COMMUNITY AND AFTER A REVIEW, ANALYSIS AND EVALUATION OF SCIENTIFIC RESEARCHES, STUDIES AND REPORTS FROM OTHER COUNTRIES OR BY INTERNATIONAL ORGANIZATIONS, INCLUDING THE CONDUCT BY AND RESULTS OF RESEARCHES AND STUDIES BY PHILIPPINE SCIENTIFIC RESEARCH ORGANIZATIONS, GOVERNMENT OR PRIVATE, AND TO THEREAFTER RECOMMEND TO CONGRESS LEGISLATIVE MEASURES ON SAFETY STANDARDS TO REGULATE THE ELECTRO-MAGNETIC RADIATION EFFECTS EMANATING FROM CELL PHONES IN ORDER TO PROTECT PUBLIC HEALTH"
