title = "HR00052"
longTitle = "A RESOLUTION DIRECTING THE DEPARTMENT OF AGRICULTURE AND THE DEPARTMENT OF SCIENCE AND TECHNOLOGY AND THEIR RESPECTIVE ATTACHED AGENCIES AS APPROPRIATE, IN AID OF LEGISLATION, TO SUBMIT TO THE COMMITTEE ON AGRICULTURE AND FOOD AND THE COMMITTEE ON SCIENCE AND TECHNOLOGY OF THE HOUSE OF REPRESENTATIVES, WITHIN A PERIOD OF NINETY (90) DAYS, A REVIEW OF THE SITUATION OF THE MUSCOVADO SUGAR INDUSTRY WITH RECOMMENDATIONS FOR THE EXPANSION OF THE SUGARCANE PLANTATIONS, PARTICULARLY ORGANICALLY GROWN SUGARCANE, THAT WILL BE DEVOTED TO THE PRODUCTION OF MUSCOVADO SUGAR, THE REHABILITATION AND UPGRADING OF EXISTING MUSCOVADO MILLS AND/OR THE INTRODUCTION OF NEW AND MODERN PROCESSING AND PACKAGING TECHNOLOGIES THAT WILL MEET INTERNATIONAL STANDARDS INCLUDING RECOMMENDATIONS FOR TECHNICAL ASSISTANCE, CREDIT SUPPORT, MARKET RESEARCH AND EXPORT PROMOTION ASSISTANCE TO LOCAL PRODUCERS AND TRADERS OF MUSCOVADO SUGAR ENGAGED IN OR PROPOSING TO ENGAGE IN EXPORT OF MUSCOVADO SUGAR AND ITS BYPRODUCTS"
