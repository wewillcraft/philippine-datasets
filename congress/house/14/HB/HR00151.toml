title = "HR00151"
longTitle = "A RESOLUTION DIRECTING THE DEPARTMENT OF TRADE AND INDUSTRY (DTI), IN AID OF LEGISLATION, TO SUBMIT TO THE COMMITTEE ON TRADE AND INDUSTRY OF THE HOUSE OF REPRESENTATIVES FOR ITS CONSIDERATION, REVIEW AND EVALUATION, A NATIONAL EXPORT PROMOTION PLAN, FOR THE PURPOSE OF DETERMINING WHETHER, IN THE EXERCISE OF ITS ORIGINAL POWER OF APPROPRIATION OF PUBLIC FUNDS AND ITS OVERSIGHT FUNCTION IN THE IMPLEMENTATION OF NATIONAL GOVERNMENT PLANS WITH BUDGETARY ALLOCATIONS, EFFECTIVE MEASURES SUCH AS A NATIONAL EXPORT PROMOTION PLAN (WITH ITS COMPONENT PROGRAMS, PROJECTS AND ACTIVITIES ACCORDING TO PRESCRIBED TIMETABLES AND SCHEDULES FOR ACCOMPLISHMENTS) HAS BEEN PROPOSED TO BE ADOPTED OR IS BEING IMPLEMENTED FOR FY 2007 AND ONWARDS, AND THAT THE DEPARTMENT OF TRADE AND INDUSTRY, COMMENCING FY 2008, SHOULD, IF SHOWN TO BE JUSTIFIED, RECOMMEND IMPROVEMENTS, THROUGH LEGISLATIVE AMENDMENTS, OF THE INSTITUTIONAL MECHANISMS FOR THE IMPLEMENTATION OF THE NATIONAL EXPORT PROMOTION PLAN, INCLUDING THE NEED, IF WARRANTED, FOR ADDITIONAL BUDGETARY FUNDING SUPPORT FOR ITS IMPLEMENTATION"
