title = "HJR0022"
longTitle = "PINAGSAMANG RESOLUSYON BILANG PAHAYAG NG DAMDAMIN NG KONGRESO NG REPUBLIKA NG PILIPINAS NA ISAKATUPARAN ANG MGA HAKBANG SA KONSERBASYON SA LANGIS TULAD NG CARLESS DAYS, MABILISANG KONSTRUKSYON  AT EKSPANSYON NG ATING MASS TRANSPORT SYSTEM, PAGLIPAT SA RENEWABLE NA PAGMUMULAN NG ENERHIYA AT/O KUMBERSIYON SA MAS MURA, HINDI MASYADONG NAKAKAPOLUSYONG PAGMUMULAN NG ENERHIYA, CARPOOLING O RESOURCE POOLING, KASAMA NG IBA PA UPANG EPEKTIBONG PAGPAPABABA NG DEMAND KUNG KAYA MAIBABABA ANG PRESYO NG GASOLINA, DIESEL AT IBA PANG PRODUKTONG LANGIS (JOINT RESOLUTION EXPRESSING THE SENSE OF THE CONGRESS OF THE REPUBLIC OF THE PHILIPPINES TO ADOPT FUEL CONSERVATION MEASURES SUCH AS CARLESS DAYS, FAST TRACKING THE CONSTRUCTION AND EXPANSION OF OUR MASS TRANSPORT SYSTEM, SHIFTING TO RENEWABLE ENERGY RESOURCES AND/OR CONVERSION TO CHEAPER, LESS POLLUTING ENERGY SOURCES, CARPOOLING OR RESOURCE POOLING, AMONG OTHERS SO AS TO EFFECTIVELY LOWER DEMAND AND THUS REDUCE THE PRICE OF GASOLINE, DIESEL AND OTHER OIL PRODUCTS"
