title = "HR01406"
longTitle = "AN OMNIBUS RESOLUTION DIRECTING THE COMMITTEE ON GOOD GOVERNMENT AND THE COMMITTEE ON GOVERNMENT ENTERPRISES AND PRIVATIZATION TO CONDUCT AN INQUIRY, IN AID OF LEGISLATION, ON THE LACK OF TRANSPARENCY BY THE METROPOLITAN WATERWORKS AND SEWERAGE SYSTEM (MWSS) WITH ITS JOINT-VENTURE AGREEMENT WITH THE SAN MIGUEL BULK WATER CO. INC. (SMBWCI) REGARDING THE P52-BILLION LAIBAN DAM PROJECT AND ITS DENIAL OF ACCESS TO THE NATIONAL ECONOMIC AND DEVELOPMENT AUTHORITY (NEDA) OF VITAL INFORMATION CONCERNING THE SAME, URGING THE OTHER APPROPRIATE COMMITTEES OF THE HOUSE OF REPRESENTATIVES TO ESTABLISH AN AD-HOC BODY TASKED TO COMPILE EXISTING STUDIES AND IDENTIFY FEASIBLE AND BETTER ALTERNATIVES TO THE LAIBAN DAM PROJECT AND MAKE RECOMMENDATIONS FOR THE ORDERLY RELOCATION OF RESIDENTS WHO WILL BE AFFECTED BY THE PROJECT AND THE ADOPTION OF SAFEGUARDS TO AVOID ANY SERIOUS DAMAGE TO THE ECOLOGY AND ENVIRONMENT"
