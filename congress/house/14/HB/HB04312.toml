remarks = "On Dec. 02, 2008, the Body ratified the Conference Ctte. Report on HB04312 and SB02264. However, on Dec. 03, 2008, the Body reconsidered the ratification of the same to introduce perfecting amendments. On Dec. 09, 2008, Rep. Garcia (P.), who moved for the reconsideration of the Conference Ctte. Rpt. due to certain extraneous and unauthorized insertions in the final draft, withdrew his motion for reconsideration. On the same date, the Body approved the Conference Ctte. Report on SB02264 and HB04312. Senate on the other hand, approved the Report on Nov. 26, 2008 but reconsidered the same on Dec. 10, 2008 and reconstituted the Senate panel, with Senators Zubiri, Angara, Aquino, Escudero and Biazon as its conferees. On Dec. 15, 2008, House again reconsidered the approval of the Conference Ctte. Rpt and reconstituted its conferees. Subsequently, on Dec. 16, 2008, the Report was approved by both Houses.                   "
