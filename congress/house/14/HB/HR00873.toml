title = "HR00873"
longTitle = "A RESOLUTION DIRECTING THE COMMITTEE ON BANKS AND FINANCIAL INTERMEDIARIES TO INVESTIGATE, IN AID OF REMEDIAL LEGISLATION, THE LEGALITY OR ILLEGALITY OF THE MEMORANDUM OF AGREEMENT (MOA) WHICH THE BANGKO SENTRAL NG PILIPINAS (BSP) ENTERED INTO WITH A PRIVATE ENTITY, THE PHILIPPINE CLEARING HOUSE CORPORATION (PCHC) UNDER WHICH THE BSP SHALL AUTHORIZE, INSPITE OF OBJECTIONS FROM THE COMMISSION ON AUDIT (COA), THE PCHC TO ESTABLISH A \\\"CASH MANAGEMENT CENTER\\\" (CMC) WHEREIN THE BSP DEVOLVES, WITHOUT LEGISLATIVE AUTHORITY, ITS CORE MANDATED FUNCTION OF HANDLING AND PROCESSING CURRENCY NOTES FOR CIRCULATION BY RECOGNIZING THE PCHC AS THE SOLE AUTHORIZED AGENT OF PARTICIPATING BANKS IN THE HANDLING OF CASH DEPOSITS TO, AND CASH WITHDRAWALS FROM, THE DEMAND DEPOSIT ACCOUNT (DDA) WITH THE BSP AND THAT BEFORE SAID MOA COULD BE IMPLEMENTED BECAUSE OF COA'S ADVERSE OBSERVATIONS, SUSPENSION OR DISALLOWANCE OF BSP ACTIONS, BSP FOREGO WITH THE FEES PAYABLE BY THE BANK AND DID NOT REINSTATE SAID FEES EVEN AFTER THE CMC PROJECT DID NOT PUSH THROUGH, THEREBY GIVING A PRIVATE ENTITY (PCHC) NOT ONLY AN ILLEGAL DELEGATION OF POWERS EXCLUSIVELY VESTED BY LAW TO THE BSP, BUT EXTENDED UNWARRANTED BENEFITS TO A PRIVATE ENTITY AND ITS COLLABORATING PRIVATE BANKS, CAUSING UNDUE LOSSES OR INJURY TO THE BSP IN BILLIONS OF PESOS IN FOREGONE FEES, WHICH RESULTED AND CONTINUE TO RESULT FROM THE MOA ILLEGALLY ENTERED INTO BETWEEN THE BSP AND PCHC, THE UNDERLYING TRANSACTIONS OF WHICH ARE MANIFESTLY AND GROSSLY DISADVANTAGEOUS TO THE BSP AND THE NATIONAL GOVERNMENT"
