title = "HR00473"
longTitle = "A RESOLUTION CALLING ON THE COMMITTEE ON BANKS AND FINANCIAL INTERMEDIARIES TO INQUIRE INTO AND INVESTIGATE, IN AID OF LEGISLATION, THE CAUSES OF THE DELETERIOUS EFFECTS ON THE GOVERNMENT SECURITIES MARKET AND TO THE BANKS TRADING IN GOVERNMENT SECURITIES WHEN THE SECURITIES AND EXCHANGE COMMISSION (SEC) WITH THE SUPPORT OF THE BANGKO SENTRAL NG PILIPINAS (BSP) REGISTERED AND ACCREDITED THE PHILIPPINE DEALING AND EXCHANGE CORPORATION (PDEX) AS A FIXED INCOME EXCHANGE AND AS THE OVER-THE-COUNTER (OTC) MARKET OPERATOR AS A CONSEQUENCE OF WHICH IT HAS BEEN MANDATED THAT BANKS SHOULD DEAL ONLY IN THE PDEX TRADING PLATFORM SUBJECT TO PAYMENT TO PDEX OF COMPULSORY AD VALOREM FEES FOR EVERY TRANSACTION WHICH ADVERSELY AFFECTED THE PRICING OF GOVERNMENT SECURITIES WHEN BANKS ARE IMPELLED TO UP THEIR BIDS AT THE PRIMARY MARKET WHICH THE BUREAU OF TREASURY INVARIABLY REJECTS, THEREBY CREATING A STALEMATE THAT MAY UNDERMINE, IF THE SITUATION CONTINUES, THE VIABILITY AND SUSTAINABILITY OF THE GOVERNMENT SECURITIES MARKET UNLESS REMEDIAL OR CORRECTIVE MEASURES ARE ADOPTED"
